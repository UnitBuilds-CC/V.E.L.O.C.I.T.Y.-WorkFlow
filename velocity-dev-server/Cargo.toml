[package]
name = "velocity-dev-server"
version = "0.1.0"
edition = "2021"
description = "One-command local VELOCITY-WorkFlow development server"

[[bin]]
name = "velocity-dev"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# gRPC server (BenchmarkService — apples-to-apples comparison)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP server (Hyper — production-grade HTTP/1.1+HTTP/2 with keep-alive)
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2"] }
http-body-util = "0.1"

# TLS support (mTLS for production, optional for dev)
tokio-rustls = "0.26"
rustls-pemfile = "2"

# System metrics (memory reporting for benchmarks)
sysinfo = "0.31"

# Memory allocator — significantly faster than system allocator for allocation-heavy workloads
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"
