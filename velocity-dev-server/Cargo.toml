[package]
name = "velocity-dev-server"
version = "0.1.0"
edition = "2021"
description = "One-command local VELOCITY-WorkFlow development server"

[[bin]]
name = "velocity-dev"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# gRPC server (BenchmarkService — apples-to-apples comparison)
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"
