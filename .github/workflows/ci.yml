name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Rust Engine Build & Test ──────────────────────────────────────────────
  rust:
    name: Rust Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -W clippy::all

      - name: Build
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --release --workspace --lib --bins -- --test-threads=1

      - name: Run integration tests
        run: cargo test --release --workspace --test '*' -- --test-threads=1
        continue-on-error: true

      - name: Run fault injection tests
        run: cargo test --release -p velocity-workflow-engine --test fault_injection_tests

      - name: Run property-based tests
        run: cargo test --release -p velocity-workflow-engine --test proptest_tests

      - name: Run API hardening tests
        run: cargo test --release -p velocity-workflow-engine --test api_hardening_tests

      - name: Run TLS/mTLS E2E tests
        run: cargo test --release -p velocity-workflow-engine --test tls_e2e_tests

      - name: Run Auth E2E tests
        run: cargo test --release -p velocity-workflow-engine --test auth_e2e_tests

      - name: Run Queue Processor tests
        run: cargo test --release -p velocity-workflow-engine --test queue_processor_tests

      - name: Run WAL & Snapshot tests
        run: cargo test --release -p velocity-workflow-engine --test wal_snapshot_tests

      - name: Run Raft Cluster tests
        run: cargo test --release -p velocity-workflow-engine --test raft_cluster_tests

      - name: Run benchmark regression gate
        run: cargo test --release -p velocity-workflow-engine --test bench_ci_gate -- --nocapture

  # ── .NET Server Build & Test ──────────────────────────────────────────────
  dotnet:
    name: .NET Server
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Build Rust native libraries
        run: cargo build --release --workspace

      - name: Copy native libraries for .NET
        run: |
          mkdir -p src/Velocity.Workflow.Core/runtimes/linux-x64/native/
          cp target/release/libvelocity_workflow_core.so src/Velocity.Workflow.Core/runtimes/linux-x64/native/
          cp target/release/libvelocity_workflow_engine.so src/Velocity.Workflow.Core/runtimes/linux-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: "**/coverage.cobertura.xml"
          fail_ci_if_error: false

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust, dotnet]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: velocity-workflow:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm Lint ─────────────────────────────────────────────────────────────
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint deploy/helm/velocity

      - name: Validate Helm template
        run: helm template test deploy/helm/velocity --debug

      - name: Validate k8s manifests
        run: |
          # Basic YAML syntax validation for k8s manifests
          for f in deploy/k8s/*.yaml; do
            echo "Validating $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || echo "Warning: $f has YAML issues"
          done
          echo "k8s manifest validation complete"

  # ── TypeScript SDKs Build & Test ──────────────────────────────────────────
  typescript-sdks:
    name: TypeScript SDKs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk:
          - dir: velocity-classic-ts
            name: Classic
          - dir: velocity-runtime-typescript
            name: Runtime
          - dir: velocity-embedded-ts
            name: Embedded
          - dir: velocity-migration-toolkit
            name: Migration
          - dir: velocity-sdk-typescript
            name: Official
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.sdk.dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ matrix.sdk.dir }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.sdk.dir }}
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ${{ matrix.sdk.dir }}
        run: npx jest --ci --coverage

  # ── Python Runtime SDK Build & Test ───────────────────────────────────────
  python-sdk:
    name: Python Runtime SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: velocity-runtime-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: velocity-runtime-python
        run: python -m pytest tests/ -v

  # ── Go SDK Build & Test ──────────────────────────────────────────────────
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Build
        working-directory: velocity-sdk-go
        run: go build ./...

      - name: Run tests
        working-directory: velocity-sdk-go
        run: go test -v -count=1 ./...

  # ── Java SDK Build & Test ────────────────────────────────────────────────
  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build and test
        working-directory: velocity-sdk-java
        run: mvn -B verify
