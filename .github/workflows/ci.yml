name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ── Rust Engine Build & Test ──────────────────────────────────────────────
  rust:
    name: Rust Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -W clippy::all 2>&1 | tail -20
        continue-on-error: true

      - name: Build
        run: cargo build --release --workspace

      - name: Run tests
        run: cargo test --release --workspace --lib --bins -- --test-threads=1

  # ── .NET Server Build & Test ──────────────────────────────────────────────
  dotnet:
    name: .NET Server
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Build Rust native libraries
        run: cargo build --release --workspace

      - name: Copy native libraries for .NET
        run: |
          mkdir -p src/Velocity.Workflow.Core/runtimes/linux-x64/native/
          cp target/release/libvelocity_workflow_core.so src/Velocity.Workflow.Core/runtimes/linux-x64/native/
          cp target/release/libvelocity_workflow_engine.so src/Velocity.Workflow.Core/runtimes/linux-x64/native/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.fsproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: "**/coverage.cobertura.xml"
          fail_ci_if_error: false

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust, dotnet]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: velocity-workflow:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm Lint ─────────────────────────────────────────────────────────────
  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4.1
        with:
          version: v3.14.0

      - name: Lint Helm chart
        run: helm lint deploy/helm/velocity

      - name: Validate Helm template
        run: helm template test deploy/helm/velocity --debug

      - name: Validate k8s manifests
        run: |
          # Basic YAML syntax validation for k8s manifests
          for f in deploy/k8s/*.yaml; do
            echo "Validating $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || echo "Warning: $f has YAML issues"
          done
          echo "k8s manifest validation complete"
