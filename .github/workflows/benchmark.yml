name: Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Benchmark profile'
        required: true
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - stress
      workloads:
        description: 'Workloads to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Start Real Temporal (Docker)
        continue-on-error: true
        run: |
          echo "Starting Real Temporal via Docker..."
          echo "Note: This may fail on memory-constrained runners."
          echo "If it fails, the benchmark will use temporal-bridge instead."
          docker compose -f velocity-bench/docker-compose.temporal.yml up -d 2>&1 || {
            echo "WARNING: Docker compose failed. Will use temporal-bridge."
            exit 0
          }
          echo "Waiting for Temporal to be healthy..."
          TEMPORAL_READY=false
          for i in $(seq 1 45); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal ready!"
              TEMPORAL_READY=true
              break
            fi
            sleep 2
          done
          if [ "$TEMPORAL_READY" = "false" ]; then
            echo "WARNING: Temporal did not become ready. Will use temporal-bridge."
            echo "Temporal logs:"
            docker compose -f velocity-bench/docker-compose.temporal.yml logs --tail 20 2>&1 || true
          fi
          docker compose -f velocity-bench/docker-compose.temporal.yml ps 2>&1 || true

      - name: Build VELOCITY servers
        run: |
          cargo build --release -p velocity-workflow-server -p velocity-bench
          cargo build --release --bin temporal-bridge
          ls -lh target/release/velocity-server target/release/temporal-bridge target/release/velocity-bench

      - name: Start VELOCITY servers
        run: |
          # Start VELOCITY production server
          ./target/release/velocity-server --grpc-port 7234 > /tmp/velocity.log 2>&1 &
          echo "VELOCITY PID: $!"
          
          # Start temporal-bridge
          ./target/release/temporal-bridge --grpc-port 7235 > /tmp/bridge.log 2>&1 &
          echo "Bridge PID: $!"
          
          # Wait for both to be ready
          for i in $(seq 1 15); do
            nc -z localhost 7234 2>/dev/null && echo "VELOCITY ready on :7234" && break
            sleep 1
          done
          for i in $(seq 1 15); do
            nc -z localhost 7235 2>/dev/null && echo "Bridge ready on :7235" && break
            sleep 1
          done

      - name: Print environment info
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  Benchmark Environment                                 "
          echo "════════════════════════════════════════════════════════"
          echo "  Runner:     ubuntu-latest (2 vCPU, 7GB RAM)"
          echo "  OS:         $(uname -a)"
          echo "  CPU:        $(lscpu | grep 'Model name' | sed 's/Model name:\s*//' | xargs)"
          echo "  vCPUs:      $(nproc)"
          echo "  RAM:        $(free -h | awk '/^Mem:/{print $2}')"
          echo "  Rust:       $(rustc --version)"
          echo "  Profile:    ${{ inputs.profile }}"
          echo "  Workloads:  ${{ inputs.workloads }}"
          echo "  Commit:     ${{ github.sha }}"
          echo "════════════════════════════════════════════════════════"

      - name: Run benchmark
        run: |
          ./target/release/velocity-bench \
            --workloads "${{ inputs.workloads }}" \
            --engine both \
            --format all \
            --profile "${{ inputs.profile }}" \
            --output bench_results.md

      - name: Run tail-latency sustained workload
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  Tail Latency Sustained Workload                       "
          echo "════════════════════════════════════════════════════════"
          # Run a sustained load test to detect memory leaks and tail latency degradation.
          # 2000 workflows at concurrency 20, measuring p99/p999 stability.
          ./target/release/velocity-bench \
            --workloads all \
            --engine velocity \
            --format json \
            --profile "${{ inputs.profile }}" \
            --output bench_tail_results.json

          # Check tail latency — p99 should be under 100ms for sustained load
          python3 -c "
          import json, sys
          with open('bench_tail_results.json') as f:
              data = json.load(f)
          vel = next((e for e in data if 'velocity' in e.get('engine','')), None)
          if not vel:
              print('WARNING: No Velocity results found for tail latency check')
              sys.exit(0)
          tail = next((w for w in vel.get('workloads',[]) if 'tail' in w['name']), None)
          if not tail:
              print('WARNING: No tail_latency workload found')
              sys.exit(0)
          p99 = tail.get('latency_p99_us', 0)
          p999 = tail.get('latency_p999_us', 0)
          err = tail.get('error_rate_pct', 0)
          print(f'Tail latency: p99={p99:.0f}us p999={p999:.0f}us error_rate={err:.2f}%')
          if p99 > 100000:
              print(f'FAIL: p99 latency {p99:.0f}us > 100ms threshold')
              sys.exit(1)
          if err > 5.0:
              print(f'FAIL: error rate {err:.2f}% > 5% threshold')
              sys.exit(1)
          print('PASS: Tail latency within acceptable bounds')
          "

      - name: Upload results (Markdown)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-md
          path: bench_results.md
          retention-days: 90

      - name: Upload results (CSV)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-csv
          path: bench_results.csv
          retention-days: 90

      - name: Upload results (JSON)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results-json
          path: bench_results.json
          retention-days: 90

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-logs
          path: |
            /tmp/velocity.log
            /tmp/bridge.log
          retention-days: 30

      - name: Print summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  Benchmark Complete                                    "
          echo "════════════════════════════════════════════════════════"
          if [ -f bench_results.md ]; then
            echo ""
            echo "── Summary ──"
            sed -n '/^## Summary/,/^## Detailed/p' bench_results.md | head -20
            echo ""
            echo "── Detailed Comparison ──"
            sed -n '/^## Detailed Comparison/,/^## Per/p' bench_results.md | head -25
          fi
          echo ""
          echo "Results uploaded as artifacts. Download from:"
          echo "  https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Benchmark regression gate
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  Benchmark Regression Gate                             "
          echo "════════════════════════════════════════════════════════"
          if [ ! -f bench_results.json ]; then
            echo "ERROR: bench_results.json not found"
            exit 1
          fi

          # Check that Velocity ops/s is above minimum thresholds.
          # These thresholds are set conservatively to catch major regressions
          # while tolerating CI runner variance.
          VELOCITY_OPS=$(python3 -c "
          import json, sys
          with open('bench_results.json') as f:
              data = json.load(f)
          vel = next((e for e in data if e.get('engine','').startswith('velocity')), None)
          if not vel:
              print('0')
              sys.exit(0)
          workloads = vel.get('workloads', [])
          if not workloads:
              print('0')
              sys.exit(0)
          # Use the simple_workflow workload as the primary gate
          simple = next((w for w in workloads if w['name'] == 'simple_workflow'), None)
          if simple:
              print(int(simple['ops_per_second']))
          else:
              print(int(workloads[0]['ops_per_second']))
          ")

          echo "Velocity ops/s: $VELOCITY_OPS"

          # Minimum threshold: 500 ops/s for simple_workflow on CI runner
          # This is ~10% of expected performance, catching only major regressions
          MIN_OPS=500
          if [ "$VELOCITY_OPS" -lt "$MIN_OPS" ]; then
            echo "FAIL: Velocity throughput $VELOCITY_OPS ops/s < minimum $MIN_OPS ops/s"
            echo "This indicates a performance regression. Check the benchmark artifacts for details."
            exit 1
          fi

          echo "PASS: Velocity throughput $VELOCITY_OPS ops/s >= minimum $MIN_OPS ops/s"
