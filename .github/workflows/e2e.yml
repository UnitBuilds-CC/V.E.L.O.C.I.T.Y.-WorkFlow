name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "velocity-workflow-*/**"
      - "docker-compose*.yml"
      - "Dockerfile"
      - "Dockerfile.web"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: velocity-e2e
  COMPOSE_FILE: docker-compose.e2e.yml
  POSTGRES_PASSWORD: e2e_test_password
  VELOCITY_SERVER_IMAGE: velocity-e2e-velocity-server:latest

jobs:
  # ── End-to-End Tests ──────────────────────────────────────────────────────
  e2e:
    name: E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Build server image (with GHA cache for speed) ───────────────────
      - name: Build server Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.VELOCITY_SERVER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Start services (server + postgres only) ─────────────────────────
      - name: Start services
        run: |
          echo "Starting E2E services (server + postgres)..."
          docker compose -f docker-compose.e2e.yml up -d --wait --wait-timeout 180
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}

      - name: Dump service status
        if: always()
        run: |
          echo "=== Service Status ==="
          docker compose -f docker-compose.e2e.yml ps -a
          echo ""
          echo "=== Service Health ==="
          docker compose -f docker-compose.e2e.yml ps --format "table {{.Name}}\t{{.Status}}\t{{.Health}}"

      # ── Health checks ───────────────────────────────────────────────────
      - name: Verify server health endpoint
        run: |
          echo "Checking velocity-server health..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Server health check passed (attempt $i)"
              curl -s http://localhost:5000/health | head -5
              exit 0
            fi
            echo "  Attempt $i: HTTP $STATUS — retrying in 5s..."
            sleep 5
          done
          echo "✗ Server did not become healthy after 20 attempts (100s)"
          echo ""
          echo "=== Server Logs (last 80 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=80 velocity-server
          echo ""
          echo "=== Postgres Logs (last 20 lines) ==="
          docker compose -f docker-compose.e2e.yml logs --tail=20 postgres
          exit 1

      # ── Required E2E assertions (CI gate) ────────────────────────────────
      - name: Run E2E test harness (required assertions)
        run: |
          echo "Running E2E test harness with required assertions..."
          bash deploy/run-e2e-tests.sh
        env:
          VELOCITY_URL: http://localhost:5000
          GRPC_PORT: "50051"

      # ── Informational smoke tests (diagnostic only) ─────────────────────
      - name: Run API smoke tests (informational)
        run: |
          echo "=== Health endpoint ==="
          curl -sf http://localhost:5000/health | jq . 2>/dev/null || echo "(not available)"
          echo ""
          echo "=== Metrics endpoint ==="
          curl -sf http://localhost:5000/metrics 2>/dev/null | head -20 || echo "(not available)"
          echo ""
          echo "=== API: List namespaces ==="
          curl -sf http://localhost:5000/api/namespaces 2>/dev/null | jq . 2>/dev/null || echo "(not available)"
          echo ""
          echo "Smoke tests completed"
        continue-on-error: true

      - name: Test workflow submission
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:5000/api/workflows \
            -H "Content-Type: application/json" \
            -d '{"workflowType":"E2ETestWorkflow","taskQueue":"e2e-queue","input":{"test":true}}' \
            -w "\n%{http_code}" 2>/dev/null || echo "000")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✓ Workflow submission succeeded (HTTP $HTTP_CODE)"
            
            # Extract workflow ID from response
            BODY=$(echo "$RESPONSE" | head -1)
            WF_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('workflowId',''))" 2>/dev/null || echo "")
            
            if [ -n "$WF_ID" ]; then
              echo "  Workflow ID: $WF_ID"
              
              # Wait for workflow to complete (poll with timeout)
              echo "  Waiting for workflow completion..."
              for i in $(seq 1 30); do
                DESC=$(curl -sf http://localhost:5000/api/workflows/$WF_ID 2>/dev/null || echo "{}")
                STATUS=$(echo "$DESC" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
                
                if [ "$STATUS" = "COMPLETED" ]; then
                  echo "  ✓ Workflow completed successfully"
                  break
                elif [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "TERMINATED" ]; then
                  echo "  ✗ Workflow ended with status: $STATUS"
                  exit 1
                fi
                sleep 1
              done
              
              # List workflows to verify visibility
              LIST=$(curl -sf http://localhost:5000/api/workflows 2>/dev/null || echo "{}")
              echo "  Workflow listing: $(echo "$LIST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"{len(d.get('workflows',[]))} workflows\")" 2>/dev/null || echo 'unavailable')"
            fi
          elif [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "⚠ Workflow API endpoint not available (expected in smoke test mode)"
          else
            echo "✗ Unexpected response: HTTP $HTTP_CODE"
            echo "$RESPONSE"
          fi
        continue-on-error: true

      # ── Teardown & artifacts ────────────────────────────────────────────
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p e2e-logs
          docker compose -f docker-compose.e2e.yml logs > e2e-logs/all-services.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs velocity-server > e2e-logs/server.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs postgres > e2e-logs/postgres.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml ps -a > e2e-logs/service-status.txt 2>&1 || true

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-logs-${{ github.sha }}
          path: e2e-logs/
          retention-days: 7

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  # ── Docker Compose Validation ─────────────────────────────────────────────
  compose-validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate docker-compose.e2e.yml
        run: docker compose -f docker-compose.e2e.yml config --quiet

      - name: Check for security best practices
        run: |
          echo "Checking for non-root users..."
          grep -q "USER" Dockerfile && echo "✓ Dockerfile uses non-root USER" || echo "✗ Missing USER directive"

          echo "Checking for health checks..."
          grep -q "healthcheck" docker-compose.yml && echo "✓ Health checks defined" || echo "✗ Missing health checks"
