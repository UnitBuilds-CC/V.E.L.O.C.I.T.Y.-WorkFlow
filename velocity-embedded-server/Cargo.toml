[package]
name = "velocity-embedded-server"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Team"]
description = "Velocity Embedded Server — NMCP transport (shmem + WebSocket)"

[[bin]]
name = "velocity-embedded-server"
path = "src/main.rs"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine" }
velocity-embedded = { path = "../velocity-embedded" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
