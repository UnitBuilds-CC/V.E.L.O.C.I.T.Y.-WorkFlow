[package]
name = "velocity-classic"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Team"]
description = "Velocity Classic — Temporal-compatible durable workflow engine"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine" }
velocity-workflow-core = { path = "../velocity-workflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
