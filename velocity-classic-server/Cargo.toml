[package]
name = "velocity-classic-server"
version = "1.0.0"
edition = "2021"
authors = ["Velocity Team"]
description = "Velocity Classic Server — HTTP/WebSocket/VCTP gateway with TLS, HMAC auth, and rate limiting"
license = "Apache-2.0"
repository = "https://github.com/velocity-workflow/velocity"
homepage = "https://github.com/velocity-workflow/velocity"
readme = "README.md"
keywords = ["workflow", "orchestration", "durable-execution", "vctp", "server"]
categories = ["network-programming", "asynchronous"]

[[bin]]
name = "velocity-classic-server"
path = "src/main.rs"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine", features = ["postgres"] }
velocity-classic = { path = "../velocity-classic" }
velocity-server-bootstrap = { path = "../velocity-server-bootstrap" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "6"
tokio-tungstenite = { version = "0.24", features = ["rustls"] }
futures-util = "0.3"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
