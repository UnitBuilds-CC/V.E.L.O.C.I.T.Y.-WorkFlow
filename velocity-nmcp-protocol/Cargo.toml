[package]
name = "velocity-nmcp-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Team"]
description = "Shared NMCP protocol types, frame parsing, shmem IPC, and WebSocket transport"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.24"
tokio-rustls = "0.26"
rustls-pemfile = "2"
futures-util = "0.3"
