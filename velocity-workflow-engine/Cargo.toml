[package]
name = "velocity-workflow-engine"
version = "0.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Hardware-native workflow execution engine — zero-allocation runtime, task queue, timer engine, and WAL persistence"

[lib]
name = "velocity_workflow_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
velocity-workflow-core = { path = "../velocity-workflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false, optional = true }
hex = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
dashmap = "6"
aes-gcm = "0.10"

# gRPC dependencies (only when grpc feature is enabled)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"], optional = true }
tokio-stream = { version = "0.1", optional = true }

# PostgreSQL persistence (behind postgres feature)
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protox = { version = "0.7", optional = true }

[features]
default = []
cloud-s3 = ["dep:hmac", "dep:hex", "dep:reqwest"]
cloud-gcs = ["dep:reqwest"]
grpc = ["dep:tonic", "dep:prost", "dep:prost-types", "dep:tokio", "dep:tokio-stream", "dep:tonic-build", "dep:protox"]
postgres = ["dep:tokio-postgres", "dep:tokio"]

[[bench]]
name = "engine_benchmarks"
harness = false

[dev-dependencies]
proptest = "1"
rcgen = "0.13"
