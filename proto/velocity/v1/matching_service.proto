syntax = "proto3";

package velocity.v1;

option go_package = "go.velocity.dev/api/velocity/v1";
option java_package = "dev.velocity.api.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "velocity/v1/common.proto";
import "velocity/v1/messages.proto";
import "velocity/v1/workflow_service.proto";

// ─── MatchingService ──────────────────────────────────────────────────────────
// Internal service for task queue matching, polling, and dispatch.
// PollActivityTaskQueue/PollWorkflowTaskQueue/RespondQueryTaskCompleted reuse
// types from workflow_service.proto. QueryWorkflow uses MatchingQuery prefix.

service MatchingService {

  // PollActivityTaskQueue — long-poll for an activity task (reuses workflow_service type)
  rpc PollActivityTaskQueue(PollActivityTaskQueueRequest)
      returns (PollActivityTaskQueueResponse);

  // PollWorkflowTaskQueue — long-poll for a workflow task (reuses workflow_service type)
  rpc PollWorkflowTaskQueue(PollWorkflowTaskQueueRequest)
      returns (PollWorkflowTaskQueueResponse);

  // AddActivityTask — enqueue an activity task
  rpc AddActivityTask(MatchAddActivityTaskRequest)
      returns (MatchAddActivityTaskResponse);

  // AddWorkflowTask — enqueue a workflow task
  rpc AddWorkflowTask(MatchAddWorkflowTaskRequest)
      returns (MatchAddWorkflowTaskResponse);

  // QueryWorkflow — query a running workflow via matching
  rpc QueryWorkflow(MatchingQueryWorkflowRequest)
      returns (MatchingQueryWorkflowResponse);

  // RespondQueryTaskCompleted — complete a query task (reuses workflow_service type)
  rpc RespondQueryTaskCompleted(RespondQueryTaskCompletedRequest)
      returns (RespondQueryTaskCompletedResponse);

  // CancelOutstandingPoll — cancel a pending long-poll
  rpc CancelOutstandingPoll(MatchCancelOutstandingPollRequest)
      returns (MatchCancelOutstandingPollResponse);

  // DescribeTaskQueue — describe a task queue's status
  rpc DescribeTaskQueue(MatchDescribeTaskQueueRequest)
      returns (MatchDescribeTaskQueueResponse);

  // ListTaskQueuePartitions — list partitions for a task queue
  rpc ListTaskQueuePartitions(MatchListTaskQueuePartitionsRequest)
      returns (MatchListTaskQueuePartitionsResponse);

  // UpdateWorkerBuildIdCompatibility — update build ID versioning
  rpc UpdateWorkerBuildIdCompatibility(MatchUpdateWorkerBuildIdCompatibilityRequest)
      returns (MatchUpdateWorkerBuildIdCompatibilityResponse);

  // GetWorkerBuildIdCompatibility — get build ID versioning info
  rpc GetWorkerBuildIdCompatibility(MatchGetWorkerBuildIdCompatibilityRequest)
      returns (MatchGetWorkerBuildIdCompatibilityResponse);

  // UpdateTaskQueueUserData — update task queue metadata
  rpc UpdateTaskQueueUserData(MatchUpdateTaskQueueUserDataRequest)
      returns (MatchUpdateTaskQueueUserDataResponse);

  // ReplicateTaskQueueUserData — replicate task queue metadata across clusters
  rpc ReplicateTaskQueueUserData(MatchReplicateTaskQueueUserDataRequest)
      returns (MatchReplicateTaskQueueUserDataResponse);

  // CheckTaskQueueUserDataPropagation — verify propagation
  rpc CheckTaskQueueUserDataPropagation(MatchCheckTaskQueueUserDataPropagationRequest)
      returns (MatchCheckTaskQueueUserDataPropagationResponse);

  // GetTaskQueueMetadata — get task queue metadata
  rpc GetTaskQueueMetadata(MatchGetTaskQueueMetadataRequest)
      returns (MatchGetTaskQueueMetadataResponse);

  // ApplyNexusTask — apply a nexus task to the queue
  rpc ApplyNexusTask(MatchApplyNexusTaskRequest)
      returns (MatchApplyNexusTaskResponse);
}

// ─── Matching-prefixed Messages ──────────────────────────────────────────────

message MatchAddActivityTaskRequest {
  string namespace_id = 1;
  WorkflowExecution execution = 2;
  string task_queue = 3;
  string activity_id = 4;
  google.protobuf.Duration schedule_to_start_timeout = 5;
  TaskVersionDirective version_directive = 6;
}

message MatchAddActivityTaskResponse {}

message MatchAddWorkflowTaskRequest {
  string namespace_id = 1;
  WorkflowExecution execution = 2;
  string task_queue = 3;
  int64 scheduled_event_id = 4;
  google.protobuf.Duration schedule_to_start_timeout = 5;
  TaskVersionDirective version_directive = 6;
}

message MatchAddWorkflowTaskResponse {}

message MatchingQueryWorkflowRequest {
  string namespace_id = 1;
  WorkflowExecution execution = 2;
  string query_type = 3;
  bytes query_args = 4;
  int32 query_reject_condition = 5;
  string header_key = 6;
}

message MatchingQueryWorkflowResponse {
  bytes result = 1;
  QueryRejected query_rejected = 2;
}

message MatchCancelOutstandingPollRequest {
  string namespace_id = 1;
  string poller_id = 2;
  string task_queue = 3;
  int32 task_queue_type = 4;
}

message MatchCancelOutstandingPollResponse {}

message MatchDescribeTaskQueueRequest {
  string namespace_id = 1;
  string task_queue = 2;
  int32 task_queue_type = 3;
  bool include_task_queue_status = 4;
}

message MatchDescribeTaskQueueResponse {
  repeated PollerInfo pollers = 1;
  TaskQueueStatus task_queue_status = 2;
}

message MatchListTaskQueuePartitionsRequest {
  string namespace_id = 1;
  string task_queue = 2;
  int32 task_queue_type = 3;
}

message MatchListTaskQueuePartitionsResponse {
  repeated TaskQueuePartitionMetadata activity_task_queue_partitions = 1;
  repeated TaskQueuePartitionMetadata workflow_task_queue_partitions = 2;
}

message MatchUpdateWorkerBuildIdCompatibilityRequest {
  string namespace_id = 1;
  string task_queue = 2;
  oneof operation {
    AddNewCompatibleVersion add_new_compatible_version = 3;
    AddNewBuildIdInNewDefaultSet add_new_build_id_in_new_default_set = 4;
    MergeSets merge_sets = 5;
  }
}

message MatchUpdateWorkerBuildIdCompatibilityResponse {}

message AddNewCompatibleVersion {
  string new_build_id = 1;
  string existing_compatible_set = 2;
  bool make_set_default = 3;
}

message AddNewBuildIdInNewDefaultSet {
  string new_build_id = 1;
}

message MergeSets {
  string primary_set = 1;
  string secondary_set = 2;
}

message MatchGetWorkerBuildIdCompatibilityRequest {
  string namespace_id = 1;
  string task_queue = 2;
  int32 max_sets = 3;
}

message MatchGetWorkerBuildIdCompatibilityResponse {
  repeated WorkerBuildIdSet major_version_sets = 1;
}

message WorkerBuildIdSet {
  repeated string build_ids = 1;
}

message MatchUpdateTaskQueueUserDataRequest {
  string namespace_id = 1;
  string task_queue = 2;
  TaskQueueUserData user_data = 3;
}

message MatchUpdateTaskQueueUserDataResponse {}

message MatchReplicateTaskQueueUserDataRequest {
  string namespace_id = 1;
  string task_queue = 2;
  TaskQueueUserData user_data = 3;
}

message MatchReplicateTaskQueueUserDataResponse {}

message MatchCheckTaskQueueUserDataPropagationRequest {
  string namespace_id = 1;
  string task_queue = 2;
  int64 version = 3;
}

message MatchCheckTaskQueueUserDataPropagationResponse {}

message MatchGetTaskQueueMetadataRequest {
  string namespace_id = 1;
  string task_queue = 2;
  int32 task_queue_type = 3;
}

message MatchGetTaskQueueMetadataResponse {
  TaskQueueMetadata metadata = 1;
}

message MatchApplyNexusTaskRequest {
  string namespace_id = 1;
  string task_queue = 2;
  bytes task_payload = 3;
}

message MatchApplyNexusTaskResponse {}
