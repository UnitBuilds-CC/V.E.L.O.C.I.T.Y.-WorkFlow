syntax = "proto3";

package velocity.v1;

option go_package = "go.velocity.dev/api/velocity/v1";
option java_package = "dev.velocity.api.v1";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "velocity/v1/common.proto";
import "velocity/v1/messages.proto";
import "velocity/v1/history_service.proto";

// ─── WorkerService ────────────────────────────────────────────────────────────
// Internal service for system workflows, batch operations, and maintenance tasks.
// Shared internal types (CloseShard, GetShard, etc.) are defined in history_service.proto.
// Types that conflict with other services use "Worker" prefix.

service WorkerService {

  // AddSearchAttributes — add search attributes to a namespace
  rpc AddSearchAttributes(WorkerAddSearchAttributesRequest)
      returns (WorkerAddSearchAttributesResponse);

  // RemoveSearchAttributes — remove search attributes from a namespace
  rpc RemoveSearchAttributes(WorkerRemoveSearchAttributesRequest)
      returns (WorkerRemoveSearchAttributesResponse);

  // DescribeHistoryHost — describe a history host
  rpc DescribeHistoryHost(WorkerDescribeHistoryHostRequest)
      returns (WorkerDescribeHistoryHostResponse);

  // GetWorkflowExecutionRawHistoryV2 — get raw history (reuses history_service type)
  rpc GetWorkflowExecutionRawHistoryV2(GetWorkflowExecutionRawHistoryV2Request)
      returns (GetWorkflowExecutionRawHistoryV2Response);

  // GetWorkflowExecutionRawHistory — get raw history (reuses history_service type)
  rpc GetWorkflowExecutionRawHistory(GetWorkflowExecutionRawHistoryRequest)
      returns (GetWorkflowExecutionRawHistoryResponse);

  // CloseShard — close a shard (reuses history_service type)
  rpc CloseShard(CloseShardRequest) returns (CloseShardResponse);

  // DescribeMutableState — describe mutable state (reuses history_service type)
  rpc DescribeMutableState(DescribeMutableStateRequest)
      returns (DescribeMutableStateResponse);

  // GetReplicationMessages — get replication messages (reuses history_service type)
  rpc GetReplicationMessages(GetReplicationMessagesRequest)
      returns (GetReplicationMessagesResponse);

  // GetNamespaceReplicationMessages — get namespace replication messages
  rpc GetNamespaceReplicationMessages(WorkerGetNamespaceReplicationMessagesRequest)
      returns (WorkerGetNamespaceReplicationMessagesResponse);

  // GetDLQReplicationMessages — get DLQ replication messages (reuses history_service type)
  rpc GetDLQReplicationMessages(GetDLQReplicationMessagesRequest)
      returns (GetDLQReplicationMessagesResponse);

  // ReapplyEvents — reapply events (reuses history_service type)
  rpc ReapplyEvents(ReapplyEventsRequest) returns (ReapplyEventsResponse);

  // RefreshWorkflowTasks — refresh workflow tasks (reuses history_service type)
  rpc RefreshWorkflowTasks(RefreshWorkflowTasksRequest)
      returns (RefreshWorkflowTasksResponse);

  // DeleteWorkflowExecution — delete a workflow execution (reuses history_service type)
  rpc DeleteWorkflowExecution(DeleteWorkflowExecutionRequest)
      returns (DeleteWorkflowExecutionResponse);

  // ListQueuedMessages — list queued messages (reuses history_service type)
  rpc ListQueuedMessages(ListQueuedMessagesRequest)
      returns (ListQueuedMessagesResponse);

  // PurgeDLQMessages — purge dead letter queue (reuses history_service type)
  rpc PurgeDLQMessages(PurgeDLQMessagesRequest) returns (PurgeDLQMessagesResponse);

  // MergeDLQMessages — merge dead letter queue (reuses history_service type)
  rpc MergeDLQMessages(MergeDLQMessagesRequest) returns (MergeDLQMessagesResponse);

  // GetDLQMessages — get dead letter queue messages (reuses history_service type)
  rpc GetDLQMessages(GetDLQMessagesRequest) returns (GetDLQMessagesResponse);

  // RebuildMutableState — rebuild mutable state from history
  rpc RebuildMutableState(WorkerRebuildMutableStateRequest)
      returns (WorkerRebuildMutableStateResponse);

  // ImportWorkflowExecution — import a workflow execution
  rpc ImportWorkflowExecution(WorkerImportWorkflowExecutionRequest)
      returns (WorkerImportWorkflowExecutionResponse);

  // DeleteDLQTasks — delete DLQ tasks
  rpc DeleteDLQTasks(WorkerDeleteDLQTasksRequest)
      returns (WorkerDeleteDLQTasksResponse);

  // ListHistoryTasks — list history tasks (reuses history_service type)
  rpc ListHistoryTasks(ListHistoryTasksRequest) returns (ListHistoryTasksResponse);

  // RemoveTask — remove a task (reuses history_service type)
  rpc RemoveTask(RemoveTaskRequest) returns (RemoveTaskResponse);

  // GetShard — get shard info (reuses history_service type)
  rpc GetShard(GetShardRequest) returns (GetShardResponse);

  // DescribeCluster — describe cluster
  rpc DescribeCluster(WorkerDescribeClusterRequest)
      returns (WorkerDescribeClusterResponse);

  // ListClusters — list clusters
  rpc ListClusters(WorkerListClustersRequest) returns (WorkerListClustersResponse);

  // AddOrUpdateRemoteCluster — add or update remote cluster
  rpc AddOrUpdateRemoteCluster(WorkerAddOrUpdateRemoteClusterRequest)
      returns (WorkerAddOrUpdateRemoteClusterResponse);

  // RemoveRemoteCluster — remove remote cluster
  rpc RemoveRemoteCluster(WorkerRemoveRemoteClusterRequest)
      returns (WorkerRemoveRemoteClusterResponse);

  // SyncWorkflowState — sync workflow state
  rpc SyncWorkflowState(WorkerSyncWorkflowStateRequest)
      returns (WorkerSyncWorkflowStateResponse);

  // GenerateLastHistoryReplicationTasks — generate replication tasks (reuses history_service type)
  rpc GenerateLastHistoryReplicationTasks(GenerateLastHistoryReplicationTasksRequest)
      returns (GenerateLastHistoryReplicationTasksResponse);

  // GetClusterInfo — get cluster info (uses Worker prefix to avoid admin conflict)
  rpc GetClusterInfo(WorkerGetClusterInfoRequest)
      returns (WorkerGetClusterInfoResponse);

  // ListTables — list database tables
  rpc ListTables(WorkerListTablesRequest) returns (WorkerListTablesResponse);

  // CreateNamespace — create a namespace (uses Worker prefix)
  rpc CreateNamespace(WorkerCreateNamespaceRequest)
      returns (WorkerCreateNamespaceResponse);

  // UpdateNamespace — update a namespace (uses Worker prefix)
  rpc UpdateNamespace(WorkerUpdateNamespaceRequest)
      returns (WorkerUpdateNamespaceResponse);

  // GetTaskQueueMetadata — get task queue metadata (uses Worker prefix)
  rpc GetTaskQueueMetadata(WorkerGetTaskQueueMetadataRequest)
      returns (WorkerGetTaskQueueMetadataResponse);
}

// ─── Worker-prefixed Messages ────────────────────────────────────────────────

message WorkerAddSearchAttributesRequest {
  map<string, int32> search_attributes = 1;
  string namespace_id = 2;
}

message WorkerAddSearchAttributesResponse {}

message WorkerRemoveSearchAttributesRequest {
  repeated string search_attributes = 1;
  string namespace_id = 2;
}

message WorkerRemoveSearchAttributesResponse {}

message WorkerDescribeHistoryHostRequest {
  string host_address = 1;
  int32 shard_id_for_host = 2;
  WorkflowExecution execution = 3;
  string namespace_id = 4;
}

message WorkerDescribeHistoryHostResponse {
  int32 shard_count = 1;
  repeated int32 owned_shard_ids = 2;
  string namespace_cache_state = 3;
  string shard_controller_state = 4;
  string address = 5;
}

message WorkerGetNamespaceReplicationMessagesRequest {
  string cluster_name = 1;
  int64 last_known_namespace_replication_task_id = 2;
}

message WorkerGetNamespaceReplicationMessagesResponse {
  repeated ReplicationTask messages = 1;
}

message WorkerRebuildMutableStateRequest {
  string namespace_id = 1;
  WorkflowExecution execution = 2;
}

message WorkerRebuildMutableStateResponse {}

message WorkerImportWorkflowExecutionRequest {
  string namespace_id = 1;
  WorkflowExecution execution = 2;
  bytes workflow_state = 3;
}

message WorkerImportWorkflowExecutionResponse {}

message WorkerDeleteDLQTasksRequest {
  string cluster_name = 1;
  int32 shard_id = 2;
  int64 inclusive_max_task_id = 3;
}

message WorkerDeleteDLQTasksResponse {
  int64 messages_deleted = 1;
}

message WorkerDescribeClusterRequest {
  string cluster_name = 1;
}

message WorkerDescribeClusterResponse {
  string cluster_name = 1;
  int32 history_shard_count = 2;
  string cluster_id = 3;
  map<string, string> version_info = 4;
  string failover_version_increment = 5;
  string initial_failover_version = 6;
  bool is_global_namespace_enabled = 7;
  bool is_connection_enabled = 8;
}

message WorkerListClustersRequest {
  int32 page_size = 1;
  bytes next_page_token = 2;
}

message WorkerListClustersResponse {
  repeated ClusterMetadata clusters = 1;
  bytes next_page_token = 2;
}

message WorkerAddOrUpdateRemoteClusterRequest {
  string frontend_address = 1;
  bool enable_remote_cluster_connection = 2;
}

message WorkerAddOrUpdateRemoteClusterResponse {}

message WorkerRemoveRemoteClusterRequest {
  string cluster_name = 1;
}

message WorkerRemoveRemoteClusterResponse {}

message WorkerSyncWorkflowStateRequest {
  string namespace_id = 1;
  WorkflowExecution execution = 2;
  bytes replication_state = 3;
}

message WorkerSyncWorkflowStateResponse {}

message WorkerGetClusterInfoRequest {}

message WorkerGetClusterInfoResponse {
  repeated string supported_clients = 1;
  string server_version = 2;
  string cluster_id = 3;
  int64 version_info = 4;
  string cluster_name = 5;
  int32 history_shard_count = 6;
  string persistence_store = 7;
  string visibility_store = 8;
}

message WorkerListTablesRequest {
  string database = 1;
  int32 page_size = 2;
  bytes next_page_token = 3;
}

message WorkerListTablesResponse {
  repeated string tables = 1;
  bytes next_page_token = 2;
}

message WorkerCreateNamespaceRequest {
  string namespace = 1;
  string description = 2;
  string owner_email = 3;
  google.protobuf.Duration workflow_execution_retention_period = 4;
  repeated ClusterReplicationConfig clusters = 5;
  string active_cluster_name = 6;
  map<string, string> data = 7;
  bool is_global_namespace = 8;
}

message WorkerCreateNamespaceResponse {
  string namespace_id = 1;
}

message WorkerUpdateNamespaceRequest {
  string namespace_id = 1;
  string description = 2;
  string owner_email = 3;
  map<string, string> data = 4;
}

message WorkerUpdateNamespaceResponse {}

message WorkerGetTaskQueueMetadataRequest {
  string namespace_id = 1;
  string task_queue = 2;
  int32 task_queue_type = 3;
}

message WorkerGetTaskQueueMetadataResponse {
  int64 max_tasks_per_second = 1;
}
