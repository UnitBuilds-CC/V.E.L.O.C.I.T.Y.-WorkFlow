[package]
name = "velocity-workflow-core"
version = "1.0.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Hardware-native zero-allocation durable execution slab engine and C-ABI FFI core"

[lib]
name = "velocity_workflow_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

