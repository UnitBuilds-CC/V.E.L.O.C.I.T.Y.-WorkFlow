[package]
name = "vctp-sidecar"
version = "1.0.0"
edition = "2021"
description = "VCTP Sidecar Proxy — TLS/crypto offload for external VCTP clients"

[workspace]

[[bin]]
name = "vctp-sidecar"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
