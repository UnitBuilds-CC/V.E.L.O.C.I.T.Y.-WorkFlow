# Fair Cross-Engine Benchmark — All 4 engines, same network, same HTTP protocol.
#
# Engines:
#   1. Velocity  — Rust workflow engine + PostgreSQL persistence
#   2. DBOS      — Python durable execution on PostgreSQL
#   3. Restate   — Node.js durable journal via Restate ingress
#   4. Temporal  — Python workflows via Temporal server
#
# All engines perform the SAME workload:
#   - 10 steps per workflow
#   - SHA-256 hash chain (2000 iterations) per step — real CPU work
#   - Per-step persistence to PostgreSQL
#   - Accessed via HTTP POST
#
# Usage:
#   docker compose -f docker-compose.fair-bench.yml up --build -d
#   docker compose -f docker-compose.fair-bench.yml run --rm bench-fair
#   docker compose -f docker-compose.fair-bench.yml down -v

services:

  # ─── PostgreSQL (shared by Velocity) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fair-bench-postgres
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity
      POSTGRES_DB: velocity_workflow
    volumes:
      - fair-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity_workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fair-bench

  # ─── Velocity Workflow Server (HTTP bench endpoint) ─────────────────────────
  workflow-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workflow-server
    container_name: fair-bench-velocity
    ports:
      - "18080:8080"
    environment:
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--ip"
      - "0.0.0.0"
      - "--vctp-port"
      - "7234"
      - "--http-bench-port"
      - "8080"
      - "--wal-path"
      - "/data/velocity.wal"
      - "--postgres"
      - "host=postgres port=5432 dbname=velocity_workflow user=velocity password=velocity sslmode=disable"
    volumes:
      - fair-velocity-data:/data
    networks:
      - fair-bench

  # ─── DBOS PostgreSQL ────────────────────────────────────────────────────────
  dbos-postgres:
    image: postgres:16-alpine
    container_name: fair-bench-dbos-pg
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos_bench
      POSTGRES_DB: dbos_bench
    volumes:
      - fair-dbos-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d dbos_bench"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fair-bench

  # ─── DBOS Service (FastAPI + durable execution) ─────────────────────────────
  dbos-service:
    build:
      context: .
      dockerfile: bench-suite/docker/dbos/Dockerfile
    container_name: fair-bench-dbos
    environment:
      DBOS_DATABASE_URL: postgresql://dbos:dbos_bench@dbos-postgres:5432/dbos_bench
      DBOS_HTTP_PORT: "8080"
    ports:
      - "18081:8080"
    depends_on:
      dbos-postgres:
        condition: service_healthy
    networks:
      - fair-bench

  # ─── Restate Server (durable journal engine) ────────────────────────────────
  restate-server:
    image: restatedev/restate:latest
    container_name: fair-bench-restate
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9070/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fair-bench

  # ─── Restate Service (Node.js handlers) ─────────────────────────────────────
  restate-service:
    build:
      context: .
      dockerfile: bench-suite/docker/restate/Dockerfile
    container_name: fair-bench-restate-svc
    environment:
      RESTATE_URL: http://restate-server:8080
    depends_on:
      restate-server:
        condition: service_healthy
    networks:
      - fair-bench

  # ─── Temporal PostgreSQL ────────────────────────────────────────────────────
  temporal-postgres:
    image: postgres:16-alpine
    container_name: fair-bench-temporal-pg
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_bench
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - fair-bench

  # ─── Temporal Server ────────────────────────────────────────────────────────
  temporal-server:
    image: temporalio/auto-setup:latest
    container_name: fair-bench-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_bench
      - POSTGRES_SEEDS=temporal-postgres
      - FRONTEND_BIND_ADDRESS=0.0.0.0:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 7233 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    networks:
      - fair-bench

  # ─── Temporal Service (FastAPI + Worker) ────────────────────────────────────
  temporal-service:
    build:
      context: .
      dockerfile: bench-suite/docker/temporal/Dockerfile
    container_name: fair-bench-temporal-svc
    environment:
      TEMPORAL_ADDRESS: temporal-server:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_HTTP_PORT: "8080"
      TEMPORAL_TASK_QUEUE: bench-queue
    ports:
      - "18083:8080"
    depends_on:
      temporal-server:
        condition: service_healthy
    networks:
      - fair-bench

  # ─── Fair Benchmark Client ──────────────────────────────────────────────────
  bench-fair:
    image: python:3.12-slim
    container_name: fair-bench-client
    depends_on:
      - workflow-server
      - dbos-service
      - restate-service
      - temporal-service
    volumes:
      - ./bench_fair.py:/bench_fair.py:ro
    entrypoint: ["python3", "/bench_fair.py", "200"]
    networks:
      - fair-bench

networks:
  fair-bench:
    driver: bridge

volumes:
  fair-pg-data:
  fair-velocity-data:
  fair-dbos-pg-data:
