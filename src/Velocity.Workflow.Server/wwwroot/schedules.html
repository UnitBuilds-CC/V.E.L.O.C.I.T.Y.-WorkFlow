<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Manager — VELOCITY WorkFlow</title>
    <link rel="stylesheet" href="css/velocity.css">
    <style>
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        
        .schedule-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.25rem;
            transition: var(--transition);
        }
        
        .schedule-card:hover {
            border-color: var(--accent-blue);
            box-shadow: var(--shadow);
        }
        
        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }
        
        .schedule-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }
        
        .schedule-cron {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.8125rem;
            color: var(--accent-cyan);
            background: var(--bg-tertiary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            display: inline-block;
            margin-top: 0.25rem;
        }
        
        .schedule-meta {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin: 1rem 0;
            font-size: 0.8125rem;
        }
        
        .schedule-meta-item {
            display: flex;
            justify-content: space-between;
        }
        
        .schedule-meta-label {
            color: var(--text-secondary);
        }
        
        .schedule-meta-value {
            font-weight: 500;
        }
        
        .schedule-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .cron-preview {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-size: 0.8125rem;
        }
        
        .cron-preview-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }
        
        .next-fire-times {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0 0 0;
        }
        
        .next-fire-times li {
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 0.25rem 0;
        }
        
        .execution-history {
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <div class="breadcrumb">
                <a href="index.html">VELOCITY</a>
                <span>›</span>
                <strong>Schedule Manager</strong>
            </div>
        </div>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-primary" onclick="openCreateModal()">+ New Schedule</button>
            <button class="btn btn-sm" onclick="refreshSchedules()">↻ Refresh</button>
            <button class="btn btn-sm" onclick="velocityTheme.toggle()">◑</button>
        </div>
    </div>
    
    <div class="content-area">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Schedules</div>
                <div class="stat-value cyan" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-value green" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Paused</div>
                <div class="stat-value yellow" id="stat-paused">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value blue" id="stat-completed">0</div>
            </div>
        </div>

        <!-- Schedule List -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">⏰ Schedules</div>
            </div>
            <div class="section-body">
                <div class="schedule-grid" id="schedule-grid"></div>
            </div>
        </div>
    </div>

    <!-- Create Schedule Modal -->
    <div class="modal-overlay" id="create-modal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create Schedule</h3>
                <button class="btn btn-sm" onclick="closeCreateModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Schedule Name</label>
                    <input type="text" class="form-input" id="schedule-name" placeholder="e.g., daily-cleanup">
                </div>
                <div class="form-group">
                    <label class="form-label">Cron Expression</label>
                    <input type="text" class="form-input" id="schedule-cron" placeholder="0 * * * *" oninput="updateCronPreview()">
                    <div class="cron-preview">
                        <div class="cron-preview-label">Human-readable:</div>
                        <div id="cron-preview-text">Enter a cron expression</div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Workflow Type</label>
                        <input type="text" class="form-input" id="schedule-workflow-type" placeholder="e.g., cleanup-workflow">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Namespace</label>
                        <input type="text" class="form-input" id="schedule-namespace" placeholder="default">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Task Queue</label>
                    <input type="text" class="form-input" id="schedule-task-queue" placeholder="default-queue">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeCreateModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createSchedule()">Create</button>
            </div>
        </div>
    </div>

    <!-- Schedule Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h3 id="detail-title">Schedule Detail</h3>
                <button class="btn btn-sm" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="modal-body" id="detail-body"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/velocity.js"></script>
    <script>
        // Initialize theme
        velocityTheme.init();

        // Mock schedule data
        const mockSchedules = [
            {
                id: 1,
                name: 'daily-cleanup',
                cron: '0 2 * * *',
                workflow_type: 'cleanup-workflow',
                namespace: 'default',
                task_queue: 'maintenance-queue',
                status: 'active',
                next_fire: Date.now() + 3600000 * 5,
                last_fire: Date.now() - 86400000,
                created_at: Date.now() - 86400000 * 30,
                execution_count: 30
            },
            {
                id: 2,
                name: 'hourly-sync',
                cron: '0 * * * *',
                workflow_type: 'sync-workflow',
                namespace: 'production',
                task_queue: 'sync-queue',
                status: 'active',
                next_fire: Date.now() + 1800000,
                last_fire: Date.now() - 1800000,
                created_at: Date.now() - 86400000 * 7,
                execution_count: 168
            },
            {
                id: 3,
                name: 'weekly-report',
                cron: '0 9 * * 1',
                workflow_type: 'report-workflow',
                namespace: 'default',
                task_queue: 'report-queue',
                status: 'paused',
                next_fire: null,
                last_fire: Date.now() - 604800000,
                created_at: Date.now() - 86400000 * 60,
                execution_count: 8
            }
        ];

        let schedules = [...mockSchedules];

        function renderSchedules() {
            const grid = document.getElementById('schedule-grid');
            
            if (schedules.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏰</div><p>No schedules found</p></div>';
                return;
            }

            grid.innerHTML = schedules.map(schedule => {
                const cronPreview = VelocityUtils.parseCron(schedule.cron);
                const nextFireTime = schedule.next_fire ? VelocityUtils.formatTimestamp(schedule.next_fire) : '—';
                
                return `
                    <div class="schedule-card" onclick="viewScheduleDetail(${schedule.id})">
                        <div class="schedule-header">
                            <div>
                                <div class="schedule-name">${schedule.name}</div>
                                <div class="schedule-cron">${schedule.cron}</div>
                            </div>
                            <span class="badge badge-${schedule.status}">${schedule.status}</span>
                        </div>
                        <div style="font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                            ${cronPreview}
                        </div>
                        <div class="schedule-meta">
                            <div class="schedule-meta-item">
                                <span class="schedule-meta-label">Workflow Type</span>
                                <span class="schedule-meta-value mono">${schedule.workflow_type}</span>
                            </div>
                            <div class="schedule-meta-item">
                                <span class="schedule-meta-label">Namespace</span>
                                <span class="schedule-meta-value">${schedule.namespace}</span>
                            </div>
                            <div class="schedule-meta-item">
                                <span class="schedule-meta-label">Next Fire</span>
                                <span class="schedule-meta-value mono" style="font-size: 0.75rem;">${nextFireTime}</span>
                            </div>
                            <div class="schedule-meta-item">
                                <span class="schedule-meta-label">Executions</span>
                                <span class="schedule-meta-value">${schedule.execution_count}</span>
                            </div>
                        </div>
                        <div class="schedule-actions">
                            ${schedule.status === 'active' 
                                ? `<button class="btn btn-sm" onclick="event.stopPropagation();pauseSchedule(${schedule.id})">⏸ Pause</button>`
                                : `<button class="btn btn-sm btn-success" onclick="event.stopPropagation();resumeSchedule(${schedule.id})">▶ Resume</button>`
                            }
                            <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteSchedule(${schedule.id})">🗑 Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const total = schedules.length;
            const active = schedules.filter(s => s.status === 'active').length;
            const paused = schedules.filter(s => s.status === 'paused').length;
            const completed = schedules.filter(s => s.status === 'completed').length;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-paused').textContent = paused;
            document.getElementById('stat-completed').textContent = completed;
        }

        function openCreateModal() {
            document.getElementById('create-modal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.remove('active');
        }

        function updateCronPreview() {
            const cron = document.getElementById('schedule-cron').value;
            const preview = VelocityUtils.parseCron(cron);
            document.getElementById('cron-preview-text').textContent = preview;
        }

        async function createSchedule() {
            const name = document.getElementById('schedule-name').value;
            const cron = document.getElementById('schedule-cron').value;
            const workflowType = document.getElementById('schedule-workflow-type').value;
            const namespace = document.getElementById('schedule-namespace').value || 'default';
            const taskQueue = document.getElementById('schedule-task-queue').value;

            if (!name || !cron || !workflowType) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            const newSchedule = {
                id: Date.now(),
                name,
                cron,
                workflow_type: workflowType,
                namespace,
                task_queue: taskQueue,
                status: 'active',
                next_fire: Date.now() + 3600000,
                last_fire: null,
                created_at: Date.now(),
                execution_count: 0
            };

            schedules.push(newSchedule);
            renderSchedules();
            updateStats();
            closeCreateModal();
            showToast('Schedule created successfully', 'success');

            // Clear form
            document.getElementById('schedule-name').value = '';
            document.getElementById('schedule-cron').value = '';
            document.getElementById('schedule-workflow-type').value = '';
            document.getElementById('schedule-namespace').value = '';
            document.getElementById('schedule-task-queue').value = '';
        }

        function pauseSchedule(id) {
            const schedule = schedules.find(s => s.id === id);
            if (schedule) {
                schedule.status = 'paused';
                schedule.next_fire = null;
                renderSchedules();
                updateStats();
                showToast('Schedule paused', 'info');
            }
        }

        function resumeSchedule(id) {
            const schedule = schedules.find(s => s.id === id);
            if (schedule) {
                schedule.status = 'active';
                schedule.next_fire = Date.now() + 3600000;
                renderSchedules();
                updateStats();
                showToast('Schedule resumed', 'success');
            }
        }

        function deleteSchedule(id) {
            if (confirm('Are you sure you want to delete this schedule?')) {
                schedules = schedules.filter(s => s.id !== id);
                renderSchedules();
                updateStats();
                showToast('Schedule deleted', 'info');
            }
        }

        function viewScheduleDetail(id) {
            const schedule = schedules.find(s => s.id === id);
            if (!schedule) return;

            document.getElementById('detail-title').textContent = schedule.name;
            
            const cronPreview = VelocityUtils.parseCron(schedule.cron);
            
            // Generate mock next fire times
            const nextFires = [];
            if (schedule.status === 'active') {
                for (let i = 0; i < 5; i++) {
                    nextFires.push(new Date(Date.now() + (i + 1) * 3600000).toISOString());
                }
            }

            document.getElementById('detail-body').innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">Status</div>
                        <div class="detail-value"><span class="badge badge-${schedule.status}">${schedule.status}</span></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Cron Expression</div>
                        <div class="detail-value">${schedule.cron}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Human-Readable</div>
                        <div class="detail-value">${cronPreview}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Workflow Type</div>
                        <div class="detail-value">${schedule.workflow_type}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Namespace</div>
                        <div class="detail-value">${schedule.namespace}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Task Queue</div>
                        <div class="detail-value">${schedule.task_queue}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Created</div>
                        <div class="detail-value">${VelocityUtils.formatTimestamp(schedule.created_at)}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Last Fire</div>
                        <div class="detail-value">${schedule.last_fire ? VelocityUtils.formatTimestamp(schedule.last_fire) : '—'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Next Fire</div>
                        <div class="detail-value">${schedule.next_fire ? VelocityUtils.formatTimestamp(schedule.next_fire) : '—'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Total Executions</div>
                        <div class="detail-value">${schedule.execution_count}</div>
                    </div>
                </div>
                
                ${schedule.status === 'active' ? `
                    <h4 style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Next Fire Times</h4>
                    <ul class="next-fire-times">
                        ${nextFires.map(t => `<li>${t}</li>`).join('')}
                    </ul>
                ` : ''}
                
                <h4 style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Execution History</h4>
                <div class="execution-history">
                    <div class="empty-state">
                        <p>No execution history available</p>
                    </div>
                </div>
            `;
            
            document.getElementById('detail-modal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.remove('active');
        }

        function refreshSchedules() {
            renderSchedules();
            updateStats();
            showToast('Schedules refreshed', 'info');
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Initialize
        renderSchedules();
        updateStats();
    </script>
</body>
</html>
