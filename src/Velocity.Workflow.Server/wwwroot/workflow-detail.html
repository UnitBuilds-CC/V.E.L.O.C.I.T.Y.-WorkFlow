<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Detail — VELOCITY WorkFlow</title>
    <style>
        :root {
            --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
            --border-color: #30363d; --text-primary: #c9d1d9; --text-secondary: #8b949e;
            --text-muted: #6e7681; --accent-blue: #58a6ff; --accent-green: #3fb950;
            --accent-red: #f85149; --accent-yellow: #d29922; --accent-purple: #bc8cff;
            --accent-cyan: #39d2c0; --accent-orange: #e3872d;
            --shadow: 0 8px 24px rgba(0,0,0,0.4); --radius: 8px; --transition: all 0.2s ease;
        }
        [data-theme="light"] {
            --bg-primary: #ffffff; --bg-secondary: #f6f8fa; --bg-tertiary: #eaeef2;
            --border-color: #d0d7de; --text-primary: #1f2328; --text-secondary: #656d76;
            --text-muted: #6e7781; --accent-blue: #0969da; --accent-green: #1a7f37;
            --accent-red: #cf222e; --accent-yellow: #9a6700; --accent-purple: #8250df;
            --accent-cyan: #0598bc; --accent-orange: #bc4c00;
            --shadow: 0 8px 24px rgba(140,149,159,0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; min-height: 100vh; }
        .topbar { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
        .topbar-left { display: flex; align-items: center; gap: 1rem; }
        .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; }
        .breadcrumb a { color: var(--accent-blue); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { color: var(--text-muted); }
        .content-area { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
        .section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
        .section-header { padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .section-title { font-size: 0.9375rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .section-body { padding: 1.25rem; }
        .badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .badge-running { background: rgba(63,185,80,0.15); color: var(--accent-green); } .badge-running::before { background: var(--accent-green); }
        .badge-completed { background: rgba(88,166,255,0.15); color: var(--accent-blue); } .badge-completed::before { background: var(--accent-blue); }
        .badge-failed { background: rgba(248,81,73,0.15); color: var(--accent-red); } .badge-failed::before { background: var(--accent-red); }
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.875rem; border-radius: var(--radius); font-size: 0.8125rem; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary); }
        .btn:hover { border-color: var(--accent-blue); }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .detail-item { display: flex; flex-direction: column; gap: 0.2rem; }
        .detail-label { font-size: 0.6875rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .detail-value { font-size: 0.875rem; font-family: 'SF Mono', Monaco, Consolas, monospace; word-break: break-all; }
        /* Timeline */
        .timeline { position: relative; padding-left: 1.75rem; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--border-color); }
        .timeline-item { position: relative; padding-bottom: 1.25rem; cursor: pointer; }
        .timeline-item::before { content: ''; position: absolute; left: -1.5rem; top: 0.3rem; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-blue); border: 2px solid var(--bg-secondary); }
        .timeline-item.ev-start::before { background: var(--accent-cyan); }
        .timeline-item.ev-step::before { background: var(--accent-green); }
        .timeline-item.ev-signal::before { background: var(--accent-purple); }
        .timeline-item.ev-complete::before { background: var(--accent-green); }
        .timeline-item.ev-fail::before { background: var(--accent-red); }
        .timeline-header { display: flex; justify-content: space-between; align-items: center; }
        .timeline-title { font-size: 0.875rem; font-weight: 500; }
        .timeline-time { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
        .timeline-detail { display: none; margin-top: 0.5rem; padding: 0.75rem; background: var(--bg-tertiary); border-radius: var(--radius); font-size: 0.8125rem; font-family: monospace; }
        .timeline-item.expanded .timeline-detail { display: block; }
        /* Hex dump */
        .hex-dump { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.75rem; background: var(--bg-tertiary); padding: 0.75rem; border-radius: var(--radius); overflow-x: auto; line-height: 1.6; }
        .hex-offset { color: var(--accent-blue); }
        .hex-byte { color: var(--text-primary); }
        .hex-ascii { color: var(--accent-green); margin-left: 1rem; }
        /* Bitmask */
        .bitmask-grid { display: flex; gap: 2px; flex-wrap: wrap; }
        .bit-cell { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 0.625rem; border-radius: 3px; font-family: monospace; cursor: pointer; transition: var(--transition); user-select: none; }
        .bit-cell:hover { transform: scale(1.15); }
        .bit-set { background: var(--accent-green); color: white; }
        .bit-unset { background: var(--bg-tertiary); color: var(--text-muted); }
        .bit-delta { box-shadow: 0 0 0 2px var(--accent-yellow); }
        /* Merkle */
        .merkle-tree { background: var(--bg-tertiary); border-radius: var(--radius); padding: 1rem; font-family: monospace; font-size: 0.8125rem; overflow-x: auto; }
        .merkle-node { display: inline-block; padding: 0.25rem 0.5rem; margin: 0.25rem; border-radius: 4px; border: 1px solid var(--border-color); }
        .merkle-root { border-color: var(--accent-cyan); color: var(--accent-cyan); font-weight: 600; }
        .merkle-leaf { border-color: var(--accent-green); color: var(--accent-green); }
        .merkle-level { margin: 0.5rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
        .merkle-level-label { color: var(--text-muted); font-size: 0.75rem; min-width: 60px; }
        /* Signal viewer */
        .payload-viewer { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .payload-hex, .payload-decoded { background: var(--bg-tertiary); border-radius: var(--radius); padding: 0.75rem; font-family: monospace; font-size: 0.8125rem; max-height: 200px; overflow-y: auto; }
        /* Child tree */
        .tree-node { padding: 0.5rem 0.75rem; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius); margin: 0.25rem 0; display: flex; align-items: center; gap: 0.5rem; }
        .tree-children { margin-left: 1.5rem; border-left: 2px solid var(--border-color); padding-left: 0.75rem; }
        /* Execution graph SVG */
        .exec-graph { background: var(--bg-tertiary); border-radius: var(--radius); padding: 1rem; text-align: center; }
        .exec-graph svg { max-width: 100%; }
        .graph-node { fill: var(--bg-secondary); stroke: var(--accent-blue); stroke-width: 2; }
        .graph-node-done { fill: var(--accent-green); stroke: var(--accent-green); }
        .graph-node-active { fill: var(--accent-yellow); stroke: var(--accent-yellow); }
        .graph-edge { stroke: var(--text-muted); stroke-width: 1.5; fill: none; }
        .graph-label { fill: var(--text-primary); font-size: 12px; text-anchor: middle; }
        @media (max-width: 768px) { .payload-viewer { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <div class="breadcrumb">
                <a href="index.html">VELOCITY</a>
                <span>›</span>
                <a href="index.html#workflows">Workflows</a>
                <span>›</span>
                <strong id="wf-key-display">#---</strong>
            </div>
        </div>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-sm" onclick="refreshData()">↻ Refresh</button>
            <button class="btn btn-sm" onclick="toggleTheme()">◑</button>
        </div>
    </div>
    <div class="content-area">
        <!-- Workflow Header -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">⚡ Workflow Execution <span id="wf-status-badge" class="badge badge-running">Running</span></div>
            </div>
            <div class="section-body">
                <div class="detail-grid" id="wf-details"></div>
            </div>
        </div>
        <!-- Event Timeline -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">📜 Event Timeline</div>
                <button class="btn btn-sm" onclick="expandAll()">Expand All</button>
            </div>
            <div class="section-body">
                <div class="timeline" id="event-timeline"></div>
            </div>
        </div>
        <!-- Slab Header Hex Dump -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🧱 Slab Header (128 bytes)</div>
                <button class="btn btn-sm" onclick="copyHexDump()">📋 Copy</button>
            </div>
            <div class="section-body">
                <div class="hex-dump" id="slab-hex-dump"></div>
            </div>
        </div>
        <!-- Bitmask256 Visualization -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🎭 Bitmask256 Interactive</div>
                <div><span id="bit-count">0</span>/256 bits set | Δ: <span id="bit-delta">0</span> changed</div>
            </div>
            <div class="section-body">
                <div class="bitmask-grid" id="bitmask-grid"></div>
            </div>
        </div>
        <!-- Merkle Tree -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🌳 Merkle Tree</div>
                <button class="btn btn-sm" onclick="verifyMerkle()">✓ Verify Root</button>
            </div>
            <div class="section-body">
                <div class="merkle-tree" id="merkle-tree"></div>
            </div>
        </div>
        <!-- Signal Payload Viewer -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">📡 Signal Payloads</div>
            </div>
            <div class="section-body">
                <div id="signal-list"></div>
            </div>
        </div>
        <!-- Query Results -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🔍 Query Results</div>
            </div>
            <div class="section-body">
                <div id="query-results"></div>
            </div>
        </div>
        <!-- Child Workflow Tree -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🌲 Child Workflow Tree</div>
            </div>
            <div class="section-body">
                <div id="child-tree"></div>
            </div>
        </div>
        <!-- Execution Graph -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">📊 Execution Graph</div>
            </div>
            <div class="section-body">
                <div class="exec-graph" id="exec-graph"></div>
            </div>
        </div>
    </div>
    <script>
        const WORKFLOW_KEY = new URLSearchParams(window.location.search).get('key') || '0';
        let bitmaskState = new Uint8Array(32);
        let bitmaskOriginal = new Uint8Array(32);
        let theme = localStorage.getItem('velocity-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('velocity-theme', theme);
        }

        // Mock data for standalone demo
        const mockWorkflow = {
            key: WORKFLOW_KEY, workflow_id: 1, run_id: 42, type_id: 100,
            namespace: 'default', task_queue: 42, status: 'Running',
            total_steps: 5, current_step: 2, event_sequence: 8,
            start_time: Date.now() - 60000, parent_key: null
        };
        const mockEvents = [
            { type: 'start', title: 'WorkflowStarted', time: Date.now() - 60000, data: { input: 'order-processing' } },
            { type: 'step', title: 'StepCompleted #0', time: Date.now() - 50000, data: { result: 'validated' } },
            { type: 'step', title: 'StepCompleted #1', time: Date.now() - 40000, data: { result: 'charged' } },
            { type: 'signal', title: 'SignalReceived #99', time: Date.now() - 30000, data: { signal_id: 99, payload: '{"approval":true}' } },
            { type: 'step', title: 'StepCompleted #2', time: Date.now() - 20000, data: { result: 'shipped' } },
        ];
        const mockSignals = [
            { id: 99, payload: new TextEncoder().encode('{"approval":true,"user":"alice"}') },
            { id: 100, payload: new TextEncoder().encode('{"amount":250}') }
        ];
        const mockChildren = [
            { key: 1001, type: 'payment', status: 'Completed' },
            { key: 1002, type: 'shipping', status: 'Running' },
            { key: 1003, type: 'notification', status: 'Running', children: [
                { key: 1004, type: 'email', status: 'Completed' }
            ]}
        ];

        function renderWorkflowDetails() {
            document.getElementById('wf-key-display').textContent = `#${mockWorkflow.key}`;
            const grid = document.getElementById('wf-details');
            const items = [
                ['Workflow Key', mockWorkflow.key], ['Workflow ID', mockWorkflow.workflow_id],
                ['Run ID', mockWorkflow.run_id], ['Type ID', mockWorkflow.type_id],
                ['Namespace', mockWorkflow.namespace], ['Task Queue', `hash:${mockWorkflow.task_queue}`],
                ['Status', mockWorkflow.status], ['Steps', `${mockWorkflow.current_step}/${mockWorkflow.total_steps}`],
                ['Event Seq', mockWorkflow.event_sequence], ['Start Time', new Date(mockWorkflow.start_time).toISOString()]
            ];
            grid.innerHTML = items.map(([l, v]) => `<div class="detail-item"><div class="detail-label">${l}</div><div class="detail-value">${v}</div></div>`).join('');
            const badge = document.getElementById('wf-status-badge');
            badge.className = `badge badge-${mockWorkflow.status.toLowerCase()}`;
            badge.textContent = mockWorkflow.status;
        }

        function renderTimeline() {
            const el = document.getElementById('event-timeline');
            el.innerHTML = mockEvents.map((e, i) => `
                <div class="timeline-item ev-${e.type}" onclick="this.classList.toggle('expanded')">
                    <div class="timeline-header">
                        <span class="timeline-title">${e.title}</span>
                        <span class="timeline-time">${new Date(e.time).toISOString().substr(11, 12)}</span>
                    </div>
                    <div class="timeline-detail"><pre>${JSON.stringify(e.data, null, 2)}</pre></div>
                </div>`).join('');
        }

        function expandAll() {
            document.querySelectorAll('.timeline-item').forEach(el => el.classList.add('expanded'));
        }

        function renderSlabHexDump() {
            const header = new Uint8Array(128);
            // Simulate slab header: magic(4) + version(4) + workflow_key(8) + merkle_root(32) + bitmask(32) + ...
            const view = new DataView(header.buffer);
            view.setUint32(0, 0x564C4F57, false); // "VLOW"
            view.setUint32(4, 1, true); // schema version
            view.setBigUint64(8, BigInt(WORKFLOW_KEY), true);
            for (let i = 44; i < 76; i++) header[i] = (i * 7) & 0xFF; // fake merkle
            for (let i = 76; i < 108; i++) header[i] = (i * 3) & 0xFF; // fake bitmask
            const el = document.getElementById('slab-hex-dump');
            let html = '';
            for (let row = 0; row < 8; row++) {
                const offset = row * 16;
                html += `<span class="hex-offset">${offset.toString(16).padStart(4, '0')}</span>  `;
                for (let col = 0; col < 16; col++) {
                    html += `<span class="hex-byte">${header[offset + col].toString(16).padStart(2, '0')}</span> `;
                    if (col === 7) html += ' ';
                }
                let ascii = '';
                for (let col = 0; col < 16; col++) {
                    const b = header[offset + col];
                    ascii += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.';
                }
                html += ` <span class="hex-ascii">${ascii}</span>\n`;
            }
            el.innerHTML = `<pre>${html}</pre>`;
        }

        function renderBitmask() {
            // Initialize with some bits set
            bitmaskState[0] = 0b10110101; bitmaskState[1] = 0b01101010;
            bitmaskState[4] = 0xFF; bitmaskState[31] = 0x01;
            bitmaskOriginal = new Uint8Array(bitmaskState);
            renderBitmaskGrid();
        }

        function renderBitmaskGrid() {
            const grid = document.getElementById('bitmask-grid');
            let html = '', setCount = 0, deltaCount = 0;
            for (let byte = 0; byte < 32; byte++) {
                for (let bit = 7; bit >= 0; bit--) {
                    const idx = byte * 8 + (7 - bit);
                    const isSet = (bitmaskState[byte] >> bit) & 1;
                    const wasSet = (bitmaskOriginal[byte] >> bit) & 1;
                    if (isSet) setCount++;
                    const isDelta = isSet !== wasSet;
                    if (isDelta) deltaCount++;
                    html += `<div class="bit-cell ${isSet ? 'bit-set' : 'bit-unset'} ${isDelta ? 'bit-delta' : ''}" data-byte="${byte}" data-bit="${bit}" onclick="toggleBit(${byte},${bit})" title="Bit ${idx}">${idx}</div>`;
                }
            }
            grid.innerHTML = html;
            document.getElementById('bit-count').textContent = setCount;
            document.getElementById('bit-delta').textContent = deltaCount;
        }

        function toggleBit(byte, bit) {
            bitmaskState[byte] ^= (1 << bit);
            renderBitmaskGrid();
        }

        function renderMerkleTree() {
            const leaves = ['a1b2c3', 'd4e5f6', 'g7h8i9', 'j0k1l2', 'm3n4o5', 'p6q7r8', 's9t0u1', 'v2w3x4'];
            const level0 = leaves.map(h => `<span class="merkle-node merkle-leaf">${h}</span>`).join('');
            const level1 = [];
            for (let i = 0; i < leaves.length; i += 2) {
                level1.push(`<span class="merkle-node">${(leaves[i] + leaves[i+1]).substr(0, 6)}</span>`);
            }
            const level2 = [];
            for (let i = 0; i < level1.length; i += 2) {
                level2.push(`<span class="merkle-node">${(leaves[i*2] + leaves[i*2+1]).substr(0, 6)}</span>`);
            }
            const root = `<span class="merkle-node merkle-root" id="merkle-root-node">root: ${leaves[0]}..${leaves[leaves.length-1]}</span>`;
            document.getElementById('merkle-tree').innerHTML = `
                <div class="merkle-level"><span class="merkle-level-label">Root:</span>${root}</div>
                <div class="merkle-level"><span class="merkle-level-label">L2:</span>${level2.join('')}</div>
                <div class="merkle-level"><span class="merkle-level-label">L1:</span>${level1.join('')}</div>
                <div class="merkle-level"><span class="merkle-level-label">Leaves:</span>${level0}</div>`;
        }

        function verifyMerkle() {
            const node = document.getElementById('merkle-root-node');
            node.style.boxShadow = '0 0 8px var(--accent-green)';
            node.textContent = '✓ ' + node.textContent;
            setTimeout(() => { node.style.boxShadow = ''; }, 2000);
        }

        function renderSignals() {
            const el = document.getElementById('signal-list');
            el.innerHTML = mockSignals.map(s => {
                const hex = Array.from(s.payload).map(b => b.toString(16).padStart(2, '0')).join(' ');
                let decoded = '';
                try { decoded = JSON.stringify(JSON.parse(new TextDecoder().decode(s.payload)), null, 2); } catch { decoded = '(binary data)'; }
                return `<div style="margin-bottom:1rem;"><strong>Signal #${s.id}</strong>
                    <div class="payload-viewer">
                        <div><div class="detail-label">Hex</div><div class="payload-hex">${hex}</div></div>
                        <div><div class="detail-label">Decoded</div><div class="payload-decoded"><pre>${decoded}</pre></div></div>
                    </div></div>`;
            }).join('') || '<p style="color:var(--text-muted)">No signals received.</p>';
        }

        function renderQueryResults() {
            document.getElementById('query-results').innerHTML = `
                <table style="width:100%;border-collapse:collapse;">
                    <tr><th style="padding:0.5rem;text-align:left;border-bottom:1px solid var(--border-color);">Query ID</th><th style="padding:0.5rem;text-align:left;border-bottom:1px solid var(--border-color);">Result</th></tr>
                    <tr><td style="padding:0.5rem;border-bottom:1px solid var(--border-color);">1</td><td style="padding:0.5rem;border-bottom:1px solid var(--border-color);font-family:monospace;">status=running, step=2/5</td></tr>
                    <tr><td style="padding:0.5rem;">2</td><td style="padding:0.5rem;font-family:monospace;">{"pending_approvals":1}</td></tr>
                </table>`;
        }

        function renderChildTree() {
            function renderNode(node) {
                let html = `<div class="tree-node"><span class="badge badge-${node.status.toLowerCase()}">${node.status}</span> <strong>#${node.key}</strong> — ${node.type}</div>`;
                if (node.children && node.children.length > 0) {
                    html += `<div class="tree-children">${node.children.map(renderNode).join('')}</div>`;
                }
                return html;
            }
            document.getElementById('child-tree').innerHTML = mockChildren.map(renderNode).join('') || '<p style="color:var(--text-muted)">No child workflows.</p>';
        }

        function renderExecGraph() {
            const steps = 5, completed = 2;
            const w = 600, h = 120, nodeR = 20, gap = (w - 80) / (steps - 1);
            let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
            for (let i = 0; i < steps - 1; i++) {
                const x1 = 40 + i * gap + nodeR, x2 = 40 + (i + 1) * gap - nodeR;
                svg += `<line class="graph-edge" x1="${x1}" y1="50" x2="${x2}" y2="50"/>`;
            }
            for (let i = 0; i < steps; i++) {
                const cx = 40 + i * gap;
                const cls = i < completed ? 'graph-node-done' : i === completed ? 'graph-node-active' : 'graph-node';
                svg += `<circle class="${cls}" cx="${cx}" cy="50" r="${nodeR}"/>`;
                svg += `<text class="graph-label" x="${cx}" y="55">${i}</text>`;
                svg += `<text class="graph-label" x="${cx}" y="90" style="font-size:10px;">${i < completed ? '✓' : i === completed ? '▶' : '○'}</text>`;
            }
            svg += '</svg>';
            document.getElementById('exec-graph').innerHTML = svg;
        }

        function refreshData() {
            renderWorkflowDetails(); renderTimeline(); renderSlabHexDump();
            renderBitmask(); renderMerkleTree(); renderSignals();
            renderQueryResults(); renderChildTree(); renderExecGraph();
        }

        function copyHexDump() {
            const text = document.getElementById('slab-hex-dump').innerText;
            navigator.clipboard.writeText(text).then(() => {});
        }

        refreshData();
    </script>
</body>
</html>
