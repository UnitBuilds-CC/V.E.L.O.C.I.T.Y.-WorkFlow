<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slab Explorer — VELOCITY WorkFlow</title>
    <style>
        :root {
            --bg-primary: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
            --border-color: #30363d; --text-primary: #c9d1d9; --text-secondary: #8b949e;
            --text-muted: #6e7681; --accent-blue: #58a6ff; --accent-green: #3fb950;
            --accent-red: #f85149; --accent-yellow: #d29922; --accent-purple: #bc8cff;
            --accent-cyan: #39d2c0; --accent-orange: #e3872d;
            --shadow: 0 8px 24px rgba(0,0,0,0.4); --radius: 8px; --transition: all 0.2s ease;
        }
        [data-theme="light"] {
            --bg-primary: #ffffff; --bg-secondary: #f6f8fa; --bg-tertiary: #eaeef2;
            --border-color: #d0d7de; --text-primary: #1f2328; --text-secondary: #656d76;
            --text-muted: #6e7781; --accent-blue: #0969da; --accent-green: #1a7f37;
            --accent-red: #cf222e; --accent-yellow: #9a6700; --accent-purple: #8250df;
            --accent-cyan: #0598bc; --accent-orange: #bc4c00;
            --shadow: 0 8px 24px rgba(140,149,159,0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; min-height: 100vh; }
        .topbar { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; }
        .topbar-left { display: flex; align-items: center; gap: 1rem; }
        .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; }
        .breadcrumb a { color: var(--accent-blue); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb span { color: var(--text-muted); }
        .content-area { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }
        .section { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); margin-bottom: 1.5rem; overflow: hidden; }
        .section-header { padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .section-title { font-size: 0.9375rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .section-body { padding: 1.25rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.875rem; border-radius: var(--radius); font-size: 0.8125rem; font-weight: 500; cursor: pointer; transition: var(--transition); border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary); }
        .btn:hover { border-color: var(--accent-blue); }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }
        .form-input, .form-select { padding: 0.5rem 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); background: var(--bg-primary); color: var(--text-primary); font-size: 0.875rem; transition: var(--transition); }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent-blue); }
        .toolbar { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.625rem 1rem; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.875rem; }
        th { background: var(--bg-tertiary); font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; font-size: 0.75rem; cursor: pointer; }
        tr:hover td { background: var(--bg-tertiary); }
        tr.clickable { cursor: pointer; }
        tr.expanded { background: var(--bg-tertiary); }
        .badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; }
        .badge-running { background: rgba(63,185,80,0.15); color: var(--accent-green); }
        .badge-completed { background: rgba(88,166,255,0.15); color: var(--accent-blue); }
        .badge-failed { background: rgba(248,81,73,0.15); color: var(--accent-red); }
        .hex-dump { font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 0.75rem; background: var(--bg-tertiary); padding: 0.75rem; border-radius: var(--radius); overflow-x: auto; line-height: 1.6; }
        .hex-offset { color: var(--accent-blue); }
        .hex-byte { color: var(--text-primary); }
        .hex-ascii { color: var(--accent-green); margin-left: 1rem; }
        .bitmask-editor { display: flex; gap: 2px; flex-wrap: wrap; margin: 0.5rem 0; }
        .bit-cell { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 0.5625rem; border-radius: 3px; font-family: monospace; cursor: pointer; transition: var(--transition); user-select: none; }
        .bit-cell:hover { transform: scale(1.15); }
        .bit-set { background: var(--accent-green); color: white; }
        .bit-unset { background: var(--bg-tertiary); color: var(--text-muted); }
        .bit-delta { box-shadow: 0 0 0 2px var(--accent-yellow); }
        .field-breakdown { display: grid; grid-template-columns: 200px 1fr; gap: 0.25rem 1rem; font-size: 0.8125rem; font-family: monospace; }
        .field-name { color: var(--text-secondary); }
        .field-value { color: var(--text-primary); }
        .detail-row { display: none; }
        .detail-row.visible { display: table-row; }
        .detail-cell { padding: 1rem; background: var(--bg-tertiary); }
        .mono { font-family: 'SF Mono', Monaco, Consolas, monospace; }
        .verified { color: var(--accent-green); font-weight: 600; }
        .failed { color: var(--accent-red); font-weight: 600; }
        @media (max-width: 768px) { .field-breakdown { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-left">
            <div class="breadcrumb">
                <a href="index.html">VELOCITY</a>
                <span>›</span>
                <strong>Slab Explorer</strong>
            </div>
        </div>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn btn-sm" onclick="refreshSlabs()">↻ Refresh</button>
            <button class="btn btn-sm" onclick="exportJSON()">📥 Export JSON</button>
            <button class="btn btn-sm" onclick="toggleTheme()">◑</button>
        </div>
    </div>
    <div class="content-area">
        <!-- Filters -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🔍 Filters</div>
            </div>
            <div class="section-body">
                <div class="toolbar">
                    <input class="form-input" id="filter-key" placeholder="Workflow key..." style="width:140px;" oninput="applyFilters()">
                    <select class="form-select" id="filter-status" onchange="applyFilters()">
                        <option value="">All Status</option>
                        <option value="Running">Running</option>
                        <option value="Completed">Completed</option>
                        <option value="Failed">Failed</option>
                    </select>
                    <input class="form-input" id="filter-namespace" placeholder="Namespace..." style="width:140px;" oninput="applyFilters()">
                    <input class="form-input" id="filter-type" placeholder="Workflow type..." style="width:140px;" oninput="applyFilters()">
                </div>
            </div>
        </div>
        <!-- Slab Table -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🧱 Slab Memory Inspector</div>
                <div><span id="slab-count">0</span> slabs loaded</div>
            </div>
            <div class="section-body" style="padding:0;">
                <div style="overflow-x:auto;">
                    <table id="slab-table">
                        <thead>
                            <tr>
                                <th onclick="sortTable('key')">Key</th>
                                <th onclick="sortTable('magic')">Magic</th>
                                <th onclick="sortTable('schema')">Schema Ver</th>
                                <th onclick="sortTable('merkle')">Merkle Root</th>
                                <th onclick="sortTable('bitmask')">Bitmask (pop)</th>
                                <th onclick="sortTable('status')">Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="slab-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Slab Detail (shown when expanded) -->
        <div class="section" id="detail-section" style="display:none;">
            <div class="section-header">
                <div class="section-title">📋 Slab Detail — <span id="detail-key">#---</span></div>
                <button class="btn btn-sm" onclick="verifyMerkleRoot()">✓ Verify Merkle Root</button>
            </div>
            <div class="section-body">
                <!-- Field breakdown -->
                <h4 style="margin-bottom:0.5rem;">Field Breakdown</h4>
                <div class="field-breakdown" id="field-breakdown"></div>
                <!-- Hex dump -->
                <h4 style="margin:1rem 0 0.5rem;">Hex Dump (128 bytes)</h4>
                <div class="hex-dump" id="detail-hex-dump"></div>
                <!-- Bitmask editor -->
                <h4 style="margin:1rem 0 0.5rem;">Bitmask Editor <span id="detail-bit-count" style="font-weight:normal;color:var(--text-muted);"></span></h4>
                <div class="bitmask-editor" id="detail-bitmask"></div>
                <div style="margin-top:0.5rem;">
                    <span id="merkle-verify-result"></span>
                </div>
            </div>
        </div>
    </div>
    <script>
        let theme = localStorage.getItem('velocity-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('velocity-theme', theme); }

        // Mock slab data
        const mockSlabs = [];
        const statuses = ['Running', 'Completed', 'Failed'];
        for (let i = 0; i < 12; i++) {
            const slab = {
                key: 1000 + i, magic: 'VLOW', schema_version: 1,
                workflow_type: [100, 101, 200][i % 3], namespace: ['default', 'production', 'staging'][i % 3],
                status: statuses[i % 3],
                merkle_root: Array.from({length: 32}, (_, j) => ((i * 31 + j * 7) & 0xFF).toString(16).padStart(2, '0')).join(''),
                bitmask: new Uint8Array(32),
                raw_bytes: new Uint8Array(128)
            };
            // Set some bitmask bits
            slab.bitmask[0] = 0b10110101 + i; slab.bitmask[4] = 0xFF; slab.bitmask[31] = i & 0xFF;
            // Build raw bytes (simulated 128-byte header)
            const view = new DataView(slab.raw_bytes.buffer);
            view.setUint32(0, 0x564C4F57, false); // magic "VLOW"
            view.setUint32(4, slab.schema_version, true);
            view.setBigUint64(8, BigInt(slab.key), true);
            view.setUint32(16, slab.workflow_type, true);
            for (let j = 0; j < 32; j++) slab.raw_bytes[44 + j] = parseInt(slab.merkle_root.substr(j * 2, 2), 16) || 0;
            for (let j = 0; j < 32; j++) slab.raw_bytes[76 + j] = slab.bitmask[j];
            mockSlabs.push(slab);
        }

        let sortCol = 'key', sortAsc = true, expandedKey = null;
        let editBitmask = new Uint8Array(32), editBitmaskOriginal = new Uint8Array(32);

        function applyFilters() {
            const keyFilter = document.getElementById('filter-key').value;
            const statusFilter = document.getElementById('filter-status').value;
            const nsFilter = document.getElementById('filter-namespace').value.toLowerCase();
            const typeFilter = document.getElementById('filter-type').value;
            let filtered = mockSlabs.filter(s => {
                if (keyFilter && !String(s.key).includes(keyFilter)) return false;
                if (statusFilter && s.status !== statusFilter) return false;
                if (nsFilter && !s.namespace.toLowerCase().includes(nsFilter)) return false;
                if (typeFilter && !String(s.workflow_type).includes(typeFilter)) return false;
                return true;
            });
            renderTable(filtered);
        }

        function sortTable(col) {
            if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
            applyFilters();
        }

        function renderTable(slabs) {
            const tbody = document.getElementById('slab-tbody');
            document.getElementById('slab-count').textContent = slabs.length;
            const popcount = (arr) => { let c = 0; for (const b of arr) for (let i = 0; i < 8; i++) if ((b >> i) & 1) c++; return c; };
            tbody.innerHTML = slabs.map(s => {
                const pop = popcount(s.bitmask);
                const merkleShort = s.merkle_root.substr(0, 16) + '...';
                return `<tr class="clickable" onclick="expandSlab(${s.key})">
                    <td class="mono">${s.key}</td>
                    <td class="mono" style="color:var(--accent-cyan);">${s.magic}</td>
                    <td>${s.schema_version}</td>
                    <td class="mono" style="font-size:0.75rem;">${merkleShort}</td>
                    <td><span class="mono">${pop}/256</span></td>
                    <td><span class="badge badge-${s.status.toLowerCase()}">${s.status}</span></td>
                    <td><button class="btn btn-sm" onclick="event.stopPropagation();expandSlab(${s.key})">Inspect</button></td>
                </tr>`;
            }).join('');
        }

        function expandSlab(key) {
            expandedKey = key;
            const slab = mockSlabs.find(s => s.key === key);
            if (!slab) return;
            document.getElementById('detail-section').style.display = 'block';
            document.getElementById('detail-key').textContent = `#${key}`;
            // Field breakdown
            const fields = [
                ['magic (0x00)', `0x${new DataView(slab.raw_bytes.buffer).getUint32(0, false).toString(16)} ("${slab.magic}")`],
                ['schema_version (0x04)', new DataView(slab.raw_bytes.buffer).getUint32(4, true)],
                ['workflow_key (0x08)', new DataView(slab.raw_bytes.buffer).getBigUint64(8, true).toString()],
                ['workflow_type (0x10)', new DataView(slab.raw_bytes.buffer).getUint32(16, true)],
                ['namespace_id (0x14)', new DataView(slab.raw_bytes.buffer).getUint32(20, true)],
                ['status (0x18)', slab.status],
                ['total_steps (0x1C)', new DataView(slab.raw_bytes.buffer).getUint32(28, true)],
                ['current_step (0x20)', new DataView(slab.raw_bytes.buffer).getUint32(32, true)],
                ['merkle_root (0x2C)', slab.merkle_root.substr(0, 32) + '...'],
                ['step_bitmask (0x4C)', `${popcount(slab.bitmask)}/256 bits set`],
            ];
            document.getElementById('field-breakdown').innerHTML = fields.map(([n, v]) => `<div class="field-name">${n}</div><div class="field-value">${v}</div>`).join('');
            // Hex dump
            renderHexDump(slab.raw_bytes);
            // Bitmask editor
            editBitmask = new Uint8Array(slab.bitmask);
            editBitmaskOriginal = new Uint8Array(slab.bitmask);
            renderBitmaskEditor();
            document.getElementById('merkle-verify-result').textContent = '';
            document.getElementById('detail-section').scrollIntoView({ behavior: 'smooth' });
        }

        function popcount(arr) { let c = 0; for (const b of arr) for (let i = 0; i < 8; i++) if ((b >> i) & 1) c++; return c; }

        function renderHexDump(bytes) {
            const el = document.getElementById('detail-hex-dump');
            let html = '';
            for (let row = 0; row < 8; row++) {
                const offset = row * 16;
                html += `<span class="hex-offset">${offset.toString(16).padStart(4, '0')}</span>  `;
                for (let col = 0; col < 16; col++) {
                    html += `<span class="hex-byte">${bytes[offset + col].toString(16).padStart(2, '0')}</span> `;
                    if (col === 7) html += ' ';
                }
                let ascii = '';
                for (let col = 0; col < 16; col++) { const b = bytes[offset + col]; ascii += (b >= 32 && b < 127) ? String.fromCharCode(b) : '.'; }
                html += ` <span class="hex-ascii">${ascii}</span>\n`;
            }
            el.innerHTML = `<pre>${html}</pre>`;
        }

        function renderBitmaskEditor() {
            const grid = document.getElementById('detail-bitmask');
            let html = '', setCount = 0, deltaCount = 0;
            for (let byte = 0; byte < 32; byte++) {
                for (let bit = 7; bit >= 0; bit--) {
                    const idx = byte * 8 + (7 - bit);
                    const isSet = (editBitmask[byte] >> bit) & 1;
                    const wasSet = (editBitmaskOriginal[byte] >> bit) & 1;
                    if (isSet) setCount++;
                    if (isSet !== wasSet) deltaCount++;
                    html += `<div class="bit-cell ${isSet ? 'bit-set' : 'bit-unset'} ${isSet !== wasSet ? 'bit-delta' : ''}" onclick="toggleBit(${byte},${bit})" title="Bit ${idx}">${idx}</div>`;
                }
            }
            grid.innerHTML = html;
            document.getElementById('detail-bit-count').textContent = `(${setCount}/256 set, Δ${deltaCount})`;
        }

        function toggleBit(byte, bit) {
            editBitmask[byte] ^= (1 << bit);
            renderBitmaskEditor();
        }

        function verifyMerkleRoot() {
            const el = document.getElementById('merkle-verify-result');
            // Simulate verification
            el.innerHTML = '<span class="verified">✓ Merkle root verified — all leaf hashes match root</span>';
            setTimeout(() => {
                if (Math.random() > 0.5) el.innerHTML = '<span class="verified">✓ Merkle root verified — all leaf hashes match root</span>';
            }, 500);
        }

        function exportJSON() {
            const data = mockSlabs.map(s => ({
                key: s.key, magic: s.magic, schema_version: s.schema_version,
                workflow_type: s.workflow_type, namespace: s.namespace, status: s.status,
                merkle_root: s.merkle_root,
                bitmask: Array.from(s.bitmask).map(b => b.toString(16).padStart(2, '0')).join(''),
                popcount: popcount(s.bitmask)
            }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'slabs.json'; a.click();
            URL.revokeObjectURL(url);
        }

        function refreshSlabs() { applyFilters(); }
        applyFilters();
    </script>
</body>
</html>
