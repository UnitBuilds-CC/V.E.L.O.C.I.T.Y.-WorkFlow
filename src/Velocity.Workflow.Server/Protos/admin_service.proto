syntax = "proto3";

package velocity.workflow.admin.v1;

option csharp_namespace = "Velocity.Workflow.Server.Protos.Admin";

// ─── Admin Service ────────────────────────────────────────────────────────────
// Mirrors Temporal's AdminService for cluster management and operational tasks.

service AdminService {
  // Cluster info
  rpc DescribeCluster (DescribeClusterRequest) returns (DescribeClusterResponse);
  rpc ListClusters (ListClustersRequest) returns (ListClustersResponse);

  // Workflow diagnostics
  rpc GetWorkflowExecutionRaw (GetWorkflowExecutionRawRequest) returns (GetWorkflowExecutionRawResponse);

  // Namespace operations
  rpc UpdateNamespace (UpdateNamespaceRequest) returns (UpdateNamespaceResponse);

  // Task queue management
  rpc ForceUnloadTaskQueue (ForceUnloadTaskQueueRequest) returns (ForceUnloadTaskQueueResponse);
}

// ─── Messages ─────────────────────────────────────────────────────────────────

message DescribeClusterRequest {}

message DescribeClusterResponse {
  string cluster_name = 1;
  string cluster_id = 2;
  int64 history_shard_count = 3;
  map<string, string> cluster_metadata = 4;
  int64 workflow_count = 5;
  int64 namespace_count = 6;
  int64 activity_count = 7;
}

message ListClustersRequest {}

message ListClustersResponse {
  repeated ClusterInfo clusters = 1;
}

message ClusterInfo {
  string cluster_name = 1;
  string cluster_id = 2;
  bool is_active = 3;
  int64 failover_version = 4;
}

message GetWorkflowExecutionRawRequest {
  string run_id = 1;
}

message GetWorkflowExecutionRawResponse {
  bytes raw_state = 1;
  int32 status = 2;
  int64 event_count = 3;
  int64 step_count = 4;
}

message UpdateNamespaceRequest {
  string namespace_name = 1;
  optional bool is_active = 2;
  optional int64 retention_days = 3;
}

message UpdateNamespaceResponse {
  bool success = 1;
}

message ForceUnloadTaskQueueRequest {
  string task_queue = 1;
}

message ForceUnloadTaskQueueResponse {
  bool success = 1;
}
