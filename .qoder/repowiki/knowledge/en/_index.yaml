      - velocity-workflow-engine/src/vctp_transport.rs
      - velocity-workflow-engine/src/vctp_rpc.rs
      - proto/vctp_service.json
    summary: "Zero-copy UDP-based RPC protocol with 28-byte binary header, CRC32 integrity, retransmission, AIMD congestion control, reorder buffer, HMAC-SHA256 authenticated encryption, and 64-depth replay protection window"

