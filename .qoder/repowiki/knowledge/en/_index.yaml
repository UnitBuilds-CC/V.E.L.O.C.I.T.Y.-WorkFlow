    summary: "WebSocket-to-VCTP gateway (WSS + rate limiting, 692 lines), HTTP-to-VCTP ingress with Swagger UI (HTTPS + rate limiting, 871 lines), and sidecar proxy with ECDH session + XOR cipher (474 lines)"

