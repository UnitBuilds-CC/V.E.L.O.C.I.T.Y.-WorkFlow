  - name: "Slab Engine Merkle Root State Proof"
    kind: persistence_system
    category: distributed_systems
    scope:
      - "velocity-workflow-core/src/slab.rs"
      - "velocity-workflow-core/src/bitmask.rs"
      - "velocity-workflow-engine/src/engine.rs"
    source_files:
      - velocity-workflow-core/src/slab.rs
      - velocity-workflow-core/src/bitmask.rs
      - velocity-workflow-core/src/ffi.rs
      - velocity-workflow-engine/src/engine.rs
    summary: "repr(C) SlabHeader with SHA-256 Merkle root state proof and Bitmask256 O(1) step completion tracking, recomputed on every step for cryptographic chain of custody"

  - name: "VCTP Kubernetes Deployment"
    kind: infrastructure
    category: operations
    scope:
      - "deploy/helm/**"
    source_files:
      - deploy/helm/velocity/values.yaml
      - deploy/helm/velocity/templates/deployment.yaml
      - deploy/helm/velocity/templates/backup-cronjob.yaml
      - deploy/helm/velocity/templates/prometheus-rules.yaml
    summary: "Helm chart with VCTP UDP port (9090), health probes, preStop graceful drain hook, circuit breaker/heartbeat/security config, TLS gateway termination (HTTPS 8443, WSS 8444), WAL backup CronJob, and Prometheus alert rules"

# Conventions for knowledge cards:
# - kind: Type of pattern (persistence_system, api_pattern, transport_protocol, security, observability, coordination, infrastructure, etc.)
# - category: Broad category (persistence, api, networking, security, monitoring, distributed_systems, operations, etc.)
# - scope: Glob patterns for files this applies to
# - source_files: Specific files that implement this pattern
# - summary: One-line description
