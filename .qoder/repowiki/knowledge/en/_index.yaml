# Knowledge Cards Index
# Each knowledge card documents a specific pattern, convention, or architecture decision
# Last updated: 2026-08-18

cards:
  - name: "Write-Ahead Log WAL Persistence"
    kind: persistence_system
    category: persistence
    scope:
      - "velocity-workflow-server/**"
      - "velocity-workflow-engine/**"
    source_files:
      - velocity-workflow-server/src/main.rs
      - velocity-workflow-engine/src/lib.rs
      - velocity-workflow-engine/src/engine.rs
    summary: "WAL-based durability with append-only log, group-commit optimization, DurabilityConfig (sync_steps, flush_interval_ms, direct_execution), and crash recovery"
    
  - name: "PostgreSQL Persistence with Connection Pooling"
    kind: persistence_system
    category: persistence
    scope:
      - "velocity-embedded/**"
      - "velocity-embedded-server/**"
      - "migrations/**"
    source_files:
      - velocity-embedded/src/main.rs
      - velocity-embedded-server/src/main.rs
      - migrations/001_initial_schema.sql
    summary: "PostgreSQL-backed durability with deadpool-postgres connection pooling, ACID transactions, and per-step journal"
    
  - name: "gRPC Benchmark Service API"
    kind: api_pattern
    category: api
    scope:
      - "proto/**"
      - "velocity-workflow-server/**"
      - "bench-suite/prod-bench/**"
    source_files:
      - proto/bench/v1/bench.proto
      - velocity-workflow-server/src/main.rs
      - bench-suite/prod-bench/src/velocity_client.rs
    summary: "Protocol Buffer-defined gRPC API for workflow benchmarking operations across multiple languages"

  - name: "NMCP Protocol Transport"
    kind: transport_protocol
    category: networking
    scope:
      - "velocity-nmcp-protocol/**"
      - "velocity-classic-server/**"
      - "velocity-embedded-server/**"
      - "velocity-classic/**"
      - "velocity-embedded/**"
    source_files:
      - velocity-nmcp-protocol/src/lib.rs
      - velocity-nmcp-protocol/src/frame.rs
      - velocity-nmcp-protocol/src/shmem.rs
      - velocity-nmcp-protocol/src/ws.rs
      - velocity-classic-server/src/main.rs
      - velocity-embedded-server/src/main.rs
    summary: "NMCP binary protocol with shared memory IPC (50-100x faster than HTTP) for local workers and WebSocket for remote clients"

  - name: "Server Bootstrap and Production Hardening"
