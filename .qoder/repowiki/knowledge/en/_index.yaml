      - velocity-server-bootstrap/src/auth.rs
      - velocity-server-bootstrap/src/rate_limit.rs
      - velocity-server-bootstrap/src/audit.rs
      - velocity-server-bootstrap/src/tracing_setup.rs
      - velocity-server-bootstrap/tests/chaos_tests.rs
      - velocity-server-bootstrap/tests/production_hardening.rs
    summary: "Shared server bootstrap logic: engine init, NMCP setup, shutdown loop, security headers, OpenTelemetry tracing, plus chaos tests and production validation"

  - name: "API Authentication and Security"
    kind: security
    category: security
    scope:
      - "velocity-server-bootstrap/src/auth.rs"
      - "velocity-server-bootstrap/src/rate_limit.rs"
      - "velocity-server-bootstrap/src/audit.rs"
    source_files:
      - velocity-server-bootstrap/src/auth.rs
      - velocity-server-bootstrap/src/rate_limit.rs
      - velocity-server-bootstrap/src/audit.rs
    summary: "API key + JWT auth with key rotation, token bucket rate limiting, structured audit logging, mTLS, security headers (nosniff, DENY, no-store), and Trivy scanning"

  - name: "Distributed Tracing OpenTelemetry"
    kind: observability
    category: monitoring
    scope:
      - "velocity-server-bootstrap/src/tracing_setup.rs"
    source_files:
      - velocity-server-bootstrap/src/tracing_setup.rs
    summary: "OpenTelemetry-based distributed tracing with optional OTLP export to Jaeger/Tempo/Grafana and configurable sampling"

  - name: "PostgreSQL Advisory Locking"
    kind: coordination
    category: distributed_systems
    scope:
