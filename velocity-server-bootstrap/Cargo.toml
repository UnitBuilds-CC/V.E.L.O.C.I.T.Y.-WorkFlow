[package]
name = "velocity-server-bootstrap"
version = "1.0.0"
edition = "2021"
authors = ["Velocity Team"]
description = "Shared server bootstrap logic — WAL engine init, PG adapter, NMCP transport setup"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine", features = ["postgres"] }
velocity-nmcp-protocol = { path = "../velocity-nmcp-protocol" }
dashmap = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tracing = "0.1"
serde_json = "1"
tokio-rustls = "0.26"
rustls-pemfile = "2"
sha2 = "0.10"        # API key hashing for constant-time comparison
hmac = "0.12"       # Proper HMAC-SHA256 for JWT validation
base64 = "0.22"   # JWT payload decoding
chrono = "0.4"     # Audit log timestamps
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry-otlp = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk"]

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio-rustls = { version = "0.26", features = ["ring"] }
