# docker-compose for DBOS-style benchmark (PostgreSQL backend).
#
# Usage:
#   docker-compose -f docker-compose.dbos.yml up -d
#
# Both Velocity Embedded and DBOS share the same PostgreSQL backend,
# ensuring a fair comparison of the workflow layer above the database.

services:
  # ─── PostgreSQL for DBOS-style workflows ─────────────────────────────────
  dbos-postgres:
    image: postgres:16-alpine
    container_name: velocity-bench-dbos-postgres
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: benchdb
    ports:
      - "5433:5432"
    volumes:
      - dbos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d benchdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dbos_pgdata:
