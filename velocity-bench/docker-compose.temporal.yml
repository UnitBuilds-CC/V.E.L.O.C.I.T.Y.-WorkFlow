# docker-compose for Temporal server (used by velocity-bench).
#
# Usage:
#   docker-compose -f docker-compose.temporal.yml up -d
#
# This starts Temporal with PostgreSQL for persistence.
# The Temporal frontend gRPC is exposed on port 7233.

services:
  # ─── PostgreSQL for Temporal ──────────────────────────────────────────────
  temporal-postgres:
    image: postgres:16-alpine
    container_name: velocity-bench-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Temporal Server ─────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.27.1
    container_name: velocity-bench-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12_pgx
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"   # Frontend gRPC
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  temporal_pgdata:
