// benchmark.proto — Common gRPC contract for VELOCITY-WorkFlow vs Temporal comparison.
//
// Both engines implement this service, ensuring an apples-to-apples comparison
// where the benchmark client communicates identically with both engines via gRPC.
// This eliminates the unfair advantage of in-process vs network calls.

syntax = "proto3";

package velocity.bench.v1;

// ─── Benchmark Service ───────────────────────────────────────────────────────
//
// Both VELOCITY and Temporal implement this identical service.
// The benchmark client connects to either engine via gRPC and runs
// the same workloads, measuring the same operations.

service BenchmarkService {
  // Start a new workflow execution.
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);

  // Signal a running workflow.
  rpc SignalWorkflow(SignalWorkflowRequest) returns (SignalWorkflowResponse);

  // Query a running workflow.
  rpc QueryWorkflow(QueryWorkflowRequest) returns (QueryWorkflowResponse);

  // Wait for a workflow to complete.
  rpc WaitForCompletion(WaitForCompletionRequest) returns (WaitForCompletionResponse);

  // Terminate a running workflow.
  rpc TerminateWorkflow(TerminateWorkflowRequest) returns (TerminateWorkflowResponse);

  // Get engine health status.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Get system info (engine version, capabilities).
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  // Reset engine state (for benchmark isolation).
  rpc Reset(ResetRequest) returns (ResetResponse);

  // Complete a workflow step (activity completion).
  rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse);

  // Register a namespace.
  rpc RegisterNamespace(RegisterNamespaceRequest) returns (RegisterNamespaceResponse);

  // Count active workflows.
  rpc CountWorkflows(CountWorkflowsRequest) returns (CountWorkflowsResponse);

  // ── Tier 1: Core workflow features ──────────────────────────────────
  // Cancel a running workflow (triggers cancellation callbacks).
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
  // Mutate a running workflow's state (Temporal's signal replacement).
  rpc UpdateWorkflowExecution(UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
  // Spawn a child workflow from a parent.
  rpc StartChildWorkflow(StartChildWorkflowRequest) returns (StartChildWorkflowResponse);
  // Schedule a timer in a running workflow.
  rpc ScheduleTimer(ScheduleTimerRequest) returns (ScheduleTimerResponse);
  // Cancel a pending timer.
  rpc CancelTimer(CancelTimerRequest) returns (CancelTimerResponse);
  // Continue-as-new: start a fresh execution with the same workflow ID.
  rpc ContinueAsNew(ContinueAsNewRequest) returns (ContinueAsNewResponse);
  // Add or update search attributes on a running workflow.
  rpc UpsertSearchAttributes(UpsertSearchAttributesRequest) returns (UpsertSearchAttributesResponse);
  // Set memo key/value pairs on a running workflow.
  rpc SetMemo(SetMemoRequest) returns (SetMemoResponse);
  // Signal-with-start: atomically signal or start+signal a workflow.
  rpc SignalWithStart(SignalWithStartRequest) returns (SignalWithStartResponse);

  // ── Tier 2: Activity & operational features ─────────────────────────
  // Heartbeat an activity (detects stuck activities).
  rpc RecordActivityHeartbeat(RecordActivityHeartbeatRequest) returns (RecordActivityHeartbeatResponse);
  // Schedule an activity task for a workflow.
  rpc ScheduleActivity(ScheduleActivityRequest) returns (ScheduleActivityResponse);
  // Complete an activity task.
  rpc CompleteActivityTask(CompleteActivityTaskRequest) returns (CompleteActivityTaskResponse);
  // Fail an activity task (triggers retry).
  rpc FailActivityTask(FailActivityTaskRequest) returns (FailActivityTaskResponse);
  // Replay a workflow from history.
  rpc ReplayWorkflow(ReplayWorkflowRequest) returns (ReplayWorkflowResponse);
  // Reset a workflow to a previous event ID.
  rpc ResetWorkflow(ResetWorkflowRequest) returns (ResetWorkflowResponse);
  // Batch terminate workflows matching a filter.
  rpc BatchTerminate(BatchTerminateRequest) returns (BatchTerminateResponse);
  // Batch signal workflows matching a filter.
  rpc BatchSignal(BatchSignalRequest) returns (BatchSignalResponse);

  // ── Tier 3: Namespace & production features ─────────────────────────
  // Describe a namespace.
  rpc DescribeNamespace(DescribeNamespaceRequest) returns (DescribeNamespaceResponse);
  // Update a namespace's configuration.
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse);
  // Delete a namespace.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  // Poll for workflow tasks (worker poll loop).
  rpc PollWorkflowTask(PollWorkflowTaskRequest) returns (PollWorkflowTaskResponse);
  // Poll for activity tasks (worker poll loop).
  rpc PollActivityTask(PollActivityTaskRequest) returns (PollActivityTaskResponse);
  // Get workflow history (full event stream).
  rpc GetWorkflowHistory(GetWorkflowHistoryRequest) returns (GetWorkflowHistoryResponse);

  // ── Tier 4: Visibility & matching (Temporal parity) ─────────────────
  // List workflows using visibility index (compound queries, pagination, sorting).
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Describe a workflow execution (status, pending activities, search attributes).
  rpc DescribeWorkflowExecution(DescribeWorkflowExecutionRequest) returns (DescribeWorkflowExecutionResponse);
  // Describe a task queue (pollers, backlog, build IDs).
  rpc DescribeTaskQueue(DescribeTaskQueueRequest) returns (DescribeTaskQueueResponse);
}

// ─── Messages ────────────────────────────────────────────────────────────────

message StartWorkflowRequest {
  string workflow_type = 1;
  string workflow_id = 2;
  string namespace = 3;
  string task_queue = 4;
  bytes input = 5;
  int32 step_count = 6;
  map<string, string> search_attributes = 7;
  int64 execution_timeout_ms = 8;
}

message StartWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
  int64 start_time_us = 3;  // Server-side start timestamp (microseconds)
}

message SignalWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string signal_name = 3;
  bytes payload = 4;
  string namespace = 5;
}

message SignalWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;  // Server-side processing latency
  string error = 3;
}

message QueryWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string query_type = 3;
  bytes payload = 4;
  string namespace = 5;
}

message QueryWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;
  bytes result = 3;
  string error = 4;
}

message WaitForCompletionRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  int64 timeout_ms = 4;
}

message WaitForCompletionResponse {
  bool success = 1;
  int64 latency_us = 2;
  bytes result = 3;
  string status = 4;       // "completed", "failed", "terminated", "timed_out"
  string error = 5;
}

message TerminateWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string reason = 4;
}

message TerminateWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;
  string error = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string engine_version = 2;
  string engine_name = 3;
  int64 uptime_secs = 4;
  int64 active_workflows = 5;
  double memory_rss_mb = 6;
  double cpu_percent = 7;
}

message GetSystemInfoRequest {}

message GetSystemInfoResponse {
  string engine_name = 1;
  string engine_version = 2;
  string runtime = 3;          // "rust" or "go"
  int64 max_workflows = 4;
  bool supports_signals = 5;
  bool supports_queries = 6;
  bool supports_child_workflows = 7;
  bool supports_sagas = 8;
  bool supports_timers = 9;
  bool supports_search_attributes = 10;
  bool supports_namespaces = 11;
  bool supports_cron = 12;
}

message ResetRequest {
  string namespace = 1;
}

message ResetResponse {
  bool success = 1;
  int64 workflows_cleared = 2;
}

message CompleteStepRequest {
  string workflow_id = 1;
  string run_id = 2;
  int32 step_index = 3;
  bytes result = 4;
  string namespace = 5;
}

message CompleteStepResponse {
  bool success = 1;
  int64 latency_us = 2;
  string error = 3;
}

message RegisterNamespaceRequest {
  string name = 1;
  string description = 2;
}

message RegisterNamespaceResponse {
  bool success = 1;
  bool already_exists = 2;
}

message CountWorkflowsRequest {
  string namespace = 1;
  string status_filter = 2;  // "all", "running", "completed", "failed"
}

message CountWorkflowsResponse {
  int64 count = 1;
}

// ─── Tier 1 Messages ────────────────────────────────────────────────────────

message CancelWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string reason = 4;
}
message CancelWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;
  string error = 3;
}

message UpdateWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string update_name = 4;
  bytes payload = 5;
  string update_id = 6;
}
message UpdateWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;
  bytes result = 3;
  string error = 4;
}

message StartChildWorkflowRequest {
  string parent_workflow_id = 1;
  string parent_run_id = 2;
  string namespace = 3;
  string workflow_type = 4;
  string workflow_id = 5;
  string task_queue = 6;
  bytes input = 7;
}
message StartChildWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
  bool success = 3;
  string error = 4;
}

message ScheduleTimerRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string timer_id = 4;
  int64 duration_ms = 5;
}
message ScheduleTimerResponse {
  bool success = 1;
  string timer_id = 2;
  int64 latency_us = 3;
}

message CancelTimerRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string timer_id = 4;
}
message CancelTimerResponse {
  bool success = 1;
  string error = 2;
}

message ContinueAsNewRequest {
  string workflow_id = 1;
  string namespace = 2;
  string workflow_type = 3;
  string task_queue = 4;
  bytes input = 5;
}
message ContinueAsNewResponse {
  string new_run_id = 1;
  bool success = 2;
  string error = 3;
}

message UpsertSearchAttributesRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  map<string, string> search_attributes = 4;
}
message UpsertSearchAttributesResponse {
  bool success = 1;
  string error = 2;
}

message SetMemoRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  map<string, string> memo = 4;
}
message SetMemoResponse {
  bool success = 1;
  string error = 2;
}

message SignalWithStartRequest {
  string workflow_type = 1;
  string workflow_id = 2;
  string namespace = 3;
  string task_queue = 4;
  bytes input = 5;
  string signal_name = 6;
  bytes signal_payload = 7;
}
message SignalWithStartResponse {
  string workflow_id = 1;
  string run_id = 2;
  bool started = 3;   // true if workflow was started, false if already running
  bool signaled = 4;
}

// ─── Tier 2 Messages ────────────────────────────────────────────────────────

message RecordActivityHeartbeatRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string activity_id = 4;
  bytes details = 5;
}
message RecordActivityHeartbeatResponse {
  bool success = 1;
  bool cancel_requested = 2;
}

message ScheduleActivityRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string activity_id = 4;
  string activity_type = 5;
  string task_queue = 6;
  bytes input = 7;
  int64 heartbeat_timeout_ms = 8;
}
message ScheduleActivityResponse {
  string activity_id = 1;
  bool success = 2;
  string error = 3;
}

message CompleteActivityTaskRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string activity_id = 4;
  bytes result = 5;
}
message CompleteActivityTaskResponse {
  bool success = 1;
  int64 latency_us = 2;
  string error = 3;
}

message FailActivityTaskRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string activity_id = 4;
  string reason = 5;
  bool non_retryable = 6;
}
message FailActivityTaskResponse {
  bool success = 1;
  bool will_retry = 2;
  int32 next_attempt = 3;
  string error = 4;
}

message ReplayWorkflowRequest {
  string workflow_id = 1;
  string namespace = 2;
}
message ReplayWorkflowResponse {
  bool success = 1;
  int64 events_replayed = 2;
  string final_status = 3;
  string error = 4;
}

message ResetWorkflowRequest {
  string workflow_id = 1;
  string namespace = 2;
  int64 reset_to_event_id = 3;
  string reason = 4;
}
message ResetWorkflowResponse {
  string new_run_id = 1;
  bool success = 2;
  string error = 3;
}

message BatchTerminateRequest {
  string namespace = 1;
  string status_filter = 2;   // "running", "all"
  string reason = 3;
  int64 max_count = 4;        // 0 = unlimited
}
message BatchTerminateResponse {
  int64 terminated_count = 1;
}

message BatchSignalRequest {
  string namespace = 1;
  string status_filter = 2;
  string signal_name = 3;
  bytes payload = 4;
  int64 max_count = 5;
}
message BatchSignalResponse {
  int64 signaled_count = 1;
}

// ─── Tier 3 Messages ────────────────────────────────────────────────────────

message DescribeNamespaceRequest {
  string name = 1;
}
message DescribeNamespaceResponse {
  string name = 1;
  string id = 2;
  string description = 3;
  string state = 4;
  uint32 retention_days = 5;
  string owner_email = 6;
  bool is_global = 7;
  int64 created_at = 8;
}

message UpdateNamespaceRequest {
  string name = 1;
  string description = 2;
  uint32 retention_days = 3;
  string owner_email = 4;
}
message UpdateNamespaceResponse {
  bool success = 1;
  string error = 2;
}

message DeleteNamespaceRequest {
  string name = 1;
}
message DeleteNamespaceResponse {
  bool success = 1;
  string error = 2;
}

message PollWorkflowTaskRequest {
  string namespace = 1;
  string task_queue = 2;
  string identity = 3;
}
message PollWorkflowTaskResponse {
  string task_token = 1;
  int64 event_id = 2;
  string event_type = 3;
  bytes workflow_execution = 4;
  bool has_task = 5;
}

message PollActivityTaskRequest {
  string namespace = 1;
  string task_queue = 2;
  string identity = 3;
}
message PollActivityTaskResponse {
  string task_token = 1;
  string activity_id = 2;
  string activity_type = 3;
  bytes input = 4;
  string workflow_id = 5;
  bool has_task = 6;
  int64 scheduled_time = 7;
}

message GetWorkflowHistoryRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  int64 max_page_size = 4;
  bytes next_page_token = 5;
}
message GetWorkflowHistoryResponse {
  repeated bytes events = 1;  // Serialized HistoryEvent JSON per element
  bytes next_page_token = 2;
  int64 total_event_count = 3;
}

// ─── Tier 4: Visibility & Matching ──────────────────────────────────────────

message ListWorkflowsRequest {
  string namespace = 1;
  string query = 2;           // SQL-like query (e.g., "WorkflowType='order' AND Status='Running'")
  int32 page_size = 3;
  bytes next_page_token = 4;
  string status_filter = 5;   // "running", "completed", "failed", "all"
  string workflow_type = 6;   // Optional type filter
  int64 start_time_from = 7;  // Epoch millis
  int64 start_time_to = 8;    // Epoch millis
}
message ListWorkflowsResponse {
  repeated WorkflowExecutionInfo executions = 1;
  bytes next_page_token = 2;
  int64 total_count = 3;
}

message WorkflowExecutionInfo {
  string workflow_id = 1;
  string run_id = 2;
  string workflow_type = 3;
  string namespace = 4;
  string status = 5;
  int64 start_time_ms = 6;
  int64 close_time_ms = 7;
  string task_queue = 8;
  map<string, string> search_attributes = 9;
  int32 history_length = 10;
}

message DescribeWorkflowExecutionRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
}
message DescribeWorkflowExecutionResponse {
  WorkflowExecutionInfo execution = 1;
  repeated PendingActivityInfo pending_activities = 2;
  repeated PendingChildInfo pending_children = 3;
  int64 history_length = 4;
  int64 execution_duration_ms = 5;
}
message PendingActivityInfo {
  string activity_id = 1;
  string activity_type = 2;
  string state = 3;
  int32 attempt = 4;
  int64 last_heartbeat_ms = 5;
}
message PendingChildInfo {
  string workflow_id = 1;
  string workflow_type = 2;
  string state = 3;
}

message DescribeTaskQueueRequest {
  string task_queue = 1;
  string namespace = 2;
  string task_queue_type = 3;  // "workflow" or "activity"
}
message DescribeTaskQueueResponse {
  repeated PollerInfo pollers = 1;
  int64 total_backlog = 2;
  int32 partition_count = 3;
  repeated string build_ids = 4;
}
message PollerInfo {
  string poller_id = 1;
  string build_id = 2;
  int64 last_poll_time_ms = 3;
}
