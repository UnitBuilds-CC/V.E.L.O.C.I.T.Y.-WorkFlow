// benchmark.proto — Common gRPC contract for VELOCITY-WorkFlow vs Temporal comparison.
//
// Both engines implement this service, ensuring an apples-to-apples comparison
// where the benchmark client communicates identically with both engines via gRPC.
// This eliminates the unfair advantage of in-process vs network calls.

syntax = "proto3";

package velocity.bench.v1;

// ─── Benchmark Service ───────────────────────────────────────────────────────
//
// Both VELOCITY and Temporal implement this identical service.
// The benchmark client connects to either engine via gRPC and runs
// the same workloads, measuring the same operations.

service BenchmarkService {
  // Start a new workflow execution.
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);

  // Signal a running workflow.
  rpc SignalWorkflow(SignalWorkflowRequest) returns (SignalWorkflowResponse);

  // Query a running workflow.
  rpc QueryWorkflow(QueryWorkflowRequest) returns (QueryWorkflowResponse);

  // Wait for a workflow to complete.
  rpc WaitForCompletion(WaitForCompletionRequest) returns (WaitForCompletionResponse);

  // Terminate a running workflow.
  rpc TerminateWorkflow(TerminateWorkflowRequest) returns (TerminateWorkflowResponse);

  // Get engine health status.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Get system info (engine version, capabilities).
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  // Reset engine state (for benchmark isolation).
  rpc Reset(ResetRequest) returns (ResetResponse);

  // Complete a workflow step (activity completion).
  rpc CompleteStep(CompleteStepRequest) returns (CompleteStepResponse);

  // Register a namespace.
  rpc RegisterNamespace(RegisterNamespaceRequest) returns (RegisterNamespaceResponse);

  // Count active workflows.
  rpc CountWorkflows(CountWorkflowsRequest) returns (CountWorkflowsResponse);
}

// ─── Messages ────────────────────────────────────────────────────────────────

message StartWorkflowRequest {
  string workflow_type = 1;
  string workflow_id = 2;
  string namespace = 3;
  string task_queue = 4;
  bytes input = 5;
  int32 step_count = 6;
  map<string, string> search_attributes = 7;
  int64 execution_timeout_ms = 8;
}

message StartWorkflowResponse {
  string workflow_id = 1;
  string run_id = 2;
  int64 start_time_us = 3;  // Server-side start timestamp (microseconds)
}

message SignalWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string signal_name = 3;
  bytes payload = 4;
  string namespace = 5;
}

message SignalWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;  // Server-side processing latency
  string error = 3;
}

message QueryWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string query_type = 3;
  bytes payload = 4;
  string namespace = 5;
}

message QueryWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;
  bytes result = 3;
  string error = 4;
}

message WaitForCompletionRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  int64 timeout_ms = 4;
}

message WaitForCompletionResponse {
  bool success = 1;
  int64 latency_us = 2;
  bytes result = 3;
  string status = 4;       // "completed", "failed", "terminated", "timed_out"
  string error = 5;
}

message TerminateWorkflowRequest {
  string workflow_id = 1;
  string run_id = 2;
  string namespace = 3;
  string reason = 4;
}

message TerminateWorkflowResponse {
  bool success = 1;
  int64 latency_us = 2;
  string error = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string engine_version = 2;
  string engine_name = 3;
  int64 uptime_secs = 4;
  int64 active_workflows = 5;
  double memory_rss_mb = 6;
  double cpu_percent = 7;
}

message GetSystemInfoRequest {}

message GetSystemInfoResponse {
  string engine_name = 1;
  string engine_version = 2;
  string runtime = 3;          // "rust" or "go"
  int64 max_workflows = 4;
  bool supports_signals = 5;
  bool supports_queries = 6;
  bool supports_child_workflows = 7;
  bool supports_sagas = 8;
  bool supports_timers = 9;
  bool supports_search_attributes = 10;
  bool supports_namespaces = 11;
  bool supports_cron = 12;
}

message ResetRequest {
  string namespace = 1;
}

message ResetResponse {
  bool success = 1;
  int64 workflows_cleared = 2;
}

message CompleteStepRequest {
  string workflow_id = 1;
  string run_id = 2;
  int32 step_index = 3;
  bytes result = 4;
  string namespace = 5;
}

message CompleteStepResponse {
  bool success = 1;
  int64 latency_us = 2;
  string error = 3;
}

message RegisterNamespaceRequest {
  string name = 1;
  string description = 2;
}

message RegisterNamespaceResponse {
  bool success = 1;
  bool already_exists = 2;
}

message CountWorkflowsRequest {
  string namespace = 1;
  string status_filter = 2;  // "all", "running", "completed", "failed"
}

message CountWorkflowsResponse {
  int64 count = 1;
}
