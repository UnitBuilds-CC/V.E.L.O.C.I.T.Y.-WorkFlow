[package]
name = "velocity-bench"
version = "0.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Side-by-side benchmark harness: VELOCITY-WorkFlow vs Temporal"

[[bin]]
name = "velocity-bench"
path = "src/main.rs"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine" }
velocity-workflow-core = { path = "../velocity-workflow-core" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# gRPC client for Temporal
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Metrics & timing
hdrhistogram = "7"
sysinfo = "0.31"

# Serialization & reporting
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
