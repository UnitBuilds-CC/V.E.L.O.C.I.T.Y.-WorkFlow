apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-operator
  namespace: velocity-system
  labels:
    app.kubernetes.io/name: velocity-operator
    app.kubernetes.io/part-of: velocity
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velocity-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velocity-operator
        app.kubernetes.io/part-of: velocity
        app.kubernetes.io/component: operator
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: velocity-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: velocity-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - /velocity-operator
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: VELOCITY_SERVER_URL
              value: "http://velocity-server.velocity-system.svc.cluster.local:5000"
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
