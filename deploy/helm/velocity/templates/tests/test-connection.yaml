apiVersion: v1
kind: Pod
metadata:
  name: {{ include "velocity.fullname" . }}-test-connection
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - /bin/sh
        - -ec
        - |
          echo "Testing HTTP endpoint..."
          wget -qO- --timeout=10 http://{{ include "velocity.fullname" . }}:{{ .Values.service.httpPort }}/health || exit 1
          echo "HTTP endpoint OK"
          echo "Testing gRPC endpoint..."
          wget -qO- --timeout=10 http://{{ include "velocity.fullname" . }}:{{ .Values.service.grpcPort }} || true
          echo "gRPC port reachable"
          echo "All tests passed"
