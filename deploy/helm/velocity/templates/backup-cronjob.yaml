{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "velocity.fullname" . }}-backup
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.retention | default 7 }}
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "velocity.labels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  SNAPSHOT_DIR="/backups/wal-snapshot-${TIMESTAMP}"
                  mkdir -p "$SNAPSHOT_DIR"

                  # ── WAL Backup ──────────────────────────────────────────
                  # WAL is append-only, safe to copy while server is running.
                  WAL_COUNT=0
                  for wal in /data/velocity/wal/*.wal; do
                    [ -f "$wal" ] && cp -a "$wal" "$SNAPSHOT_DIR/" && WAL_COUNT=$((WAL_COUNT + 1))
                  done
                  # Copy WAL metadata
                  for meta in /data/velocity/wal/*.meta /data/velocity/wal/*.offset; do
                    [ -f "$meta" ] && cp -a "$meta" "$SNAPSHOT_DIR/"
                  done
                  echo "WAL files backed up: ${WAL_COUNT}"

                  # Compute integrity checksums
                  (cd "$SNAPSHOT_DIR" && find . -type f ! -name CHECKSUMS -exec sha256sum {} \; > CHECKSUMS)
                  echo "Checksums: $(wc -l < "$SNAPSHOT_DIR/CHECKSUMS") files"

                  # ── PostgreSQL Dump ─────────────────────────────────────
                  pg_dump -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" \
                    --format=custom --compress=6 \
                    -f "/backups/velocity-${TIMESTAMP}.dump"
                  echo "PostgreSQL dump completed: velocity-${TIMESTAMP}.dump"

                  # ── Retention Cleanup ───────────────────────────────────
                  RETENTION_DAYS={{ .Values.backup.retention | default 7 }}
                  find /backups -maxdepth 1 -name "wal-snapshot-*" -type d -mtime +${RETENTION_DAYS} -exec rm -rf {} \;
                  find /backups -maxdepth 1 -name "velocity-*.dump" -mtime +${RETENTION_DAYS} -delete
                  echo "Backup completed at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
              env:
                - name: PGHOST
                  value: {{ .Values.postgresql.host | default (printf "%s-postgresql" (include "velocity.fullname" .)) | quote }}
                - name: PGPORT
                  value: {{ .Values.postgresql.port | default 5432 | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgresql.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgresql.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      {{- if .Values.postgresql.existingSecret }}
                      name: {{ .Values.postgresql.existingSecret }}
                      key: {{ .Values.postgresql.existingSecretKey }}
                      {{- else }}
                      name: {{ include "velocity.fullname" . }}-secret
                      key: postgresql-password
                      {{- end }}
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
                {{- if .Values.persistence.enabled }}
                - name: wal-data
                  mountPath: /data/velocity/wal
                  subPath: wal
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: backup-data
              {{- if .Values.backup.storage.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "velocity.fullname" . }}-backup-pvc
              {{- else }}
              emptyDir: {}
              {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: wal-data
              persistentVolumeClaim:
                claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "velocity.fullname" .)) }}
            {{- end }}
{{- end }}
