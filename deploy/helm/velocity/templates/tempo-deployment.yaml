{{- if .Values.monitoring.tempo.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "velocity.tempoFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "velocity.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        {{- include "velocity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: tempo
    spec:
      containers:
        - name: tempo
          image: "{{ .Values.monitoring.tempo.image.repository }}:{{ .Values.monitoring.tempo.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.tempo.image.pullPolicy }}
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - name: http
              containerPort: 3200
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.tempo.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velocity.tempoFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
  selector:
    {{- include "velocity.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: tempo
{{- end }}
