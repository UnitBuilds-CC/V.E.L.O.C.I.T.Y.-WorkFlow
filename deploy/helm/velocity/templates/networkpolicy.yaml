{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "velocity.fullname" . }}-netpol
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "velocity.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound HTTP API traffic
    - ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
      {{- if .Values.networkPolicy.allowedIngressNamespaces }}
      from:
        {{- range .Values.networkPolicy.allowedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
    # Allow inbound gRPC traffic
    - ports:
        - port: {{ .Values.service.grpcPort }}
          protocol: TCP
      {{- if .Values.networkPolicy.allowedIngressNamespaces }}
      from:
        {{- range .Values.networkPolicy.allowedIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
    # Allow Prometheus scraping on metrics port
    - ports:
        - port: {{ .Values.service.httpPort }}
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow egress to PostgreSQL
    - ports:
        - port: {{ .Values.postgresql.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.postgresqlNamespace }}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgresqlNamespace }}
      {{- end }}
    # Allow egress to Prometheus (for pushgateway if needed)
    - ports:
        - port: 9090
          protocol: TCP
      {{- if .Values.networkPolicy.prometheusNamespace }}
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace }}
      {{- end }}
{{- end }}
