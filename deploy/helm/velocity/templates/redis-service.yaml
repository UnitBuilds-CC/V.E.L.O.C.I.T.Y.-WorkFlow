{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velocity.redisFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "velocity.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velocity.redisFullname" . }}-headless
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "velocity.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: redis
{{- end }}
