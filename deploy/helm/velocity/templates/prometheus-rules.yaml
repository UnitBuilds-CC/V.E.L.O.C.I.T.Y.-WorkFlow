{{- if .Values.monitoring.prometheus.rules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "velocity.fullname" . }}-alerts
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
    {{- with .Values.monitoring.prometheus.rules.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: velocity-server.rules
      rules:
        # ── Critical Alerts ──────────────────────────────────────────────────
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{job="{{ include "velocity.fullname" . }}",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{job="{{ include "velocity.fullname" . }}"}[5m])) > {{ .Values.monitoring.prometheus.rules.highErrorRate.threshold | default 0.05 }}
          for: {{ .Values.monitoring.prometheus.rules.highErrorRate.duration | default "5m" }}
          labels:
            severity: critical
          annotations:
            summary: "High HTTP error rate detected"
            description: "More than {{ "{{ $value | humanizePercentage }}" }} of requests are failing with 5xx errors."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",pod=~"{{ include "velocity.fullname" . }}.*"}[15m]) * 60 * 15 > {{ .Values.monitoring.prometheus.rules.podCrashLooping.threshold | default 5 }}
          for: "5m"
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ "{{ $labels.pod }}" }} is crash looping"
            description: "Pod has restarted {{ "{{ $value }}" }} times in the last 15 minutes."

        - alert: HighMemoryUsage
          expr: |
            container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}",pod=~"{{ include "velocity.fullname" . }}.*"}
            /
            container_spec_memory_limit_bytes{namespace="{{ .Release.Namespace }}",pod=~"{{ include "velocity.fullname" . }}.*"} > {{ .Values.monitoring.prometheus.rules.highMemoryUsage.threshold | default 0.85 }}
          for: {{ .Values.monitoring.prometheus.rules.highMemoryUsage.duration | default "10m" }}
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ "{{ $labels.pod }}" }}"
            description: "Container memory usage is above {{ "{{ $value | humanizePercentage }}" }} of limit."

        # ── Warning Alerts ───────────────────────────────────────────────────
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="{{ include "velocity.fullname" . }}"}[5m])) by (le)) > {{ .Values.monitoring.prometheus.rules.highLatency.threshold | default 1.0 }}
          for: {{ .Values.monitoring.prometheus.rules.highLatency.duration | default "5m" }}
          labels:
            severity: warning
          annotations:
            summary: "High request latency detected"
            description: "95th percentile latency is {{ "{{ $value }}" }}s, exceeding threshold."

        - alert: LowThroughput
          expr: |
            sum(rate(http_requests_total{job="{{ include "velocity.fullname" . }}"}[5m])) < {{ .Values.monitoring.prometheus.rules.lowThroughput.threshold | default 1 }}
          for: {{ .Values.monitoring.prometheus.rules.lowThroughput.duration | default "10m" }}
          labels:
            severity: warning
          annotations:
            summary: "Low request throughput"
            description: "Request rate has dropped below {{ "{{ $value }}" }} req/s."

        # ── VCTP (UDP) Alerts ────────────────────────────────────────────────
        - alert: VctpHighErrorRate
          expr: |
            sum(rate(vctp_errors_total{job="{{ include "velocity.fullname" . }}"}[5m]))
            /
            sum(rate(vctp_requests_total{job="{{ include "velocity.fullname" . }}"}[5m])) > 0.05
          for: "5m"
          labels:
            severity: critical
          annotations:
            summary: "High VCTP error rate detected"
            description: "More than 5% of VCTP requests are failing."

        - alert: VctpCircuitBreakerOpen
          expr: vctp_circuit_state{job="{{ include "velocity.fullname" . }}"} == 1
          for: "2m"
          labels:
            severity: critical
          annotations:
            summary: "VCTP circuit breaker is OPEN"
            description: "The VCTP RPC server circuit breaker has tripped. Requests are being rejected."

        - alert: VctpLowThroughput
          expr: |
            sum(rate(vctp_requests_total{job="{{ include "velocity.fullname" . }}"}[5m])) < 1
          for: "10m"
          labels:
            severity: warning
          annotations:
            summary: "Low VCTP throughput"
            description: "VCTP request rate has dropped below 1 req/s."

        - alert: VctpHighLatency
          expr: |
            rate(vctp_request_duration_seconds_sum{job="{{ include "velocity.fullname" . }}"}[5m])
            /
            rate(vctp_request_duration_seconds_count{job="{{ include "velocity.fullname" . }}"}[5m]) > 0.05
          for: "5m"
          labels:
            severity: warning
          annotations:
            summary: "High VCTP request latency"
            description: "Average VCTP request duration exceeds 50ms."

        - alert: VctpDrainActive
          expr: vctp_drain_active{job="{{ include "velocity.fullname" . }}"} == 1
          for: "10m"
          labels:
            severity: warning
          annotations:
            summary: "VCTP drain has been active for 10+ minutes"
            description: "The VCTP server has been draining for an extended period. Check pod termination."

        - alert: VctpAuthRejectionsSpike
          expr: |
            sum(rate(vctp_auth_rejected_total{job="{{ include "velocity.fullname" . }}"}[5m])) > 10
          for: "5m"
          labels:
            severity: warning
          annotations:
            summary: "Spike in VCTP auth rejections"
            description: "More than 10 VCTP requests/s are being rejected for authentication failures."
{{- end }}
