{{- if .Values.monitoring.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "velocity.jaegerFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "velocity.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        {{- include "velocity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: "{{ .Values.monitoring.jaeger.image.repository }}:{{ .Values.monitoring.jaeger.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.jaeger.image.pullPolicy }}
          args:
            - --collector.otlp.enabled=true
            - --query.base-path=/
          ports:
            - name: query
              containerPort: 16686
              protocol: TCP
            - name: collector
              containerPort: 14268
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: query
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: query
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.jaeger.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velocity.jaegerFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  type: ClusterIP
  ports:
    - name: query
      port: 16686
      targetPort: query
      protocol: TCP
    - name: collector
      port: 14268
      targetPort: collector
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
  selector:
    {{- include "velocity.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: jaeger
{{- end }}
