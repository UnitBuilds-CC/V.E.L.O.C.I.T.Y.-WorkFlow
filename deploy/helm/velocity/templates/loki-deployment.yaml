{{- if .Values.monitoring.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "velocity.lokiFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "velocity.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        {{- include "velocity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/name: loki
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: "{{ .Values.monitoring.loki.image.repository }}:{{ .Values.monitoring.loki.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.loki.image.pullPolicy }}
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.loki.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /loki
      volumes:
        - name: data
          {{- if .Values.monitoring.loki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "velocity.lokiFullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "velocity.lokiFullname" . }}
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3100
      targetPort: http
  selector:
    {{- include "velocity.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/name: loki
{{- if .Values.monitoring.loki.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "velocity.lokiFullname" . }}-data
  labels:
    {{- include "velocity.labels" . | nindent 4 }}
    app.kubernetes.io/component: logging
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.monitoring.loki.persistence.storageClass }}
  storageClassName: {{ .Values.monitoring.loki.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitoring.loki.persistence.size }}
{{- end }}
{{- end }}
