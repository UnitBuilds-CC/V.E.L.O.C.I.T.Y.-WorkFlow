# =============================================================================
# Default values for the Velocity Workflow Helm chart
# =============================================================================

replicaCount: 2

image:
  repository: velocity-workflow-server
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "velocity-server"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 5000
  grpcPort: 50051

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: velocity.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# ── Application Configuration ──────────────────────────────────────────────
config:
  environment: Production
  logging:
    level: Information
  metrics:
    enabled: true

# ── PostgreSQL ──────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  host: ""
  port: 5432
  database: velocity
  username: velocity
  password: velocity_secret
  existingSecret: ""
  existingSecretKey: password

# ── gRPC ────────────────────────────────────────────────────────────────────
grpc:
  port: 50051

# ── Auth ────────────────────────────────────────────────────────────────────
auth:
  jwtIssuer: ""
  jwtAudience: ""
  apiKeys: []

# ── Persistence ─────────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# ── Pod Disruption Budget ───────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ── Network Policy ──────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Restrict ingress to these namespaces (empty = allow all)
  allowedIngressNamespaces: []
  # Namespace where PostgreSQL runs (for egress rules)
  postgresqlNamespace: ""
  # Namespace where Prometheus runs (for egress rules)
  prometheusNamespace: "monitoring"

# ── Service Monitor (Prometheus Operator) ───────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  metricsPath: /metrics
  honorLabels: true
  # Additional labels for ServiceMonitor (e.g., for Prometheus selector)
  additionalLabels: {}
  # Relabeling rules
  relabelings: []

# ── Grafana Dashboard ───────────────────────────────────────────────────────
grafanaDashboard:
  enabled: true
  # Additional labels for dashboard ConfigMap (e.g., grafana_dashboard: "1")
  additionalLabels:
    grafana_dashboard: "1"
  annotations: {}

# ── Topology Spread Constraints ─────────────────────────────────────────────
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

# ── Operator ──────────────────────────────────────────────────────────────────
operator:
  enabled: false
  image:
    repository: velocity-operator
    pullPolicy: IfNotPresent
    tag: "latest"
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  leaderElect: true
  velocityServerUrl: "http://velocity-server.velocity-system.svc.cluster.local:5000"

# ── Automated Backups ────────────────────────────────────────────────────────
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    enabled: false
    storageClass: ""
    size: 20Gi
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

# ── TLS ──────────────────────────────────────────────────────────────────────
tls:
  enabled: false
  certManager: true
  issuerRef:
    name: ""
    kind: ClusterIssuer
  secretName: velocity-tls
  commonName: velocity.local
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days

# ── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  dashboards:
    enabled: false
    # Namespace where Grafana is deployed (for dashboard ConfigMap label selector)
    namespace: monitoring
    labels:
      grafana_dashboard: "1"
