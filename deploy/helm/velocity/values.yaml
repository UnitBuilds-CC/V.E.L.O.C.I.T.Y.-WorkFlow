# =============================================================================
# Default values for the Velocity Workflow Helm chart
# Production-grade configuration
# =============================================================================

# ── Replica Count ────────────────────────────────────────────────────────────
replicaCount: 2

# ── Deployment Strategy ──────────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Keep this many old ReplicaSets for rollback
revisionHistoryLimit: 10

# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: velocity-workflow-server
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: "velocity-server"

# ── Pod Metadata ─────────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5000"
  prometheus.io/path: "/metrics"

podLabels: {}

# ── Security ─────────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Advanced Security ───────────────────────────────────────────────────────
security:
  podSecurityPolicy:
    enabled: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    seccompProfile: RuntimeDefault

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  httpPort: 5000
  grpcPort: 50051
  annotations: {}
  # Optional static IPs for LoadBalancer type
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: velocity.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: velocity-tls
  #    hosts:
  #      - velocity.local

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# ── Autoscaling ──────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# ── Scheduling ───────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
dnsPolicy: ClusterFirst
dnsConfig:
  options:
    - name: ndots
      value: "2"

# ── Application Configuration ────────────────────────────────────────────────
config:
  environment: Production
  logging:
    level: Information
  metrics:
    enabled: true

# ── PostgreSQL ───────────────────────────────────────────────────────────────
postgresql:
  # Set to false to use an external database; set host accordingly.
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: velocity
    password: velocity_secret
    database: velocity
    existingSecret: ""
    existingSecretKey: password
  port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  # Init container runs schema migrations on first boot
  initSchema:
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
  # PostgreSQL tuning (applied via environment variables)
  tuning:
    maxConnections: 200
    sharedBuffers: 256MB
    effectiveCacheSize: 768MB
    workMem: 4MB
    maintenanceWorkMem: 64MB
    walLevel: replica
    maxWalSenders: 3

# ── gRPC ─────────────────────────────────────────────────────────────────────
grpc:
  port: 50051

# ── Auth ─────────────────────────────────────────────────────────────────────
auth:
  jwtIssuer: ""
  jwtAudience: ""
  apiKeys: []

# ── Pod Disruption Budget ────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ── Network Policy ───────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Default-deny policy: blocks ALL ingress/egress unless explicitly allowed
  denyAll:
    enabled: false
  allowedIngressNamespaces: []
  postgresqlNamespace: ""
  prometheusNamespace: "monitoring"
  ingressRules: []
  #  - from:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: monitoring
  #    ports:
  #      - protocol: TCP
  #        port: 5000
  egressRules: []
  #  - to:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: velocity-system
  #    ports:
  #      - protocol: TCP
  #        port: 5432

# ── Service Monitor (Prometheus Operator) ────────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  metricsPath: /metrics
  honorLabels: true
  additionalLabels: {}
  relabelings: []

# ── Grafana Dashboard ────────────────────────────────────────────────────────
grafanaDashboard:
  enabled: true
  additionalLabels:
    grafana_dashboard: "1"
  annotations: {}

# ── Topology Spread Constraints ──────────────────────────────────────────────
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

# ── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  dashboards:
    enabled: false
    namespace: monitoring
    labels:
      grafana_dashboard: "1"
  prometheus:
    enabled: false
    image:
      repository: prom/prometheus
      tag: "v2.51.0"
      pullPolicy: IfNotPresent
    scrapeInterval: 30s
    retention: 15d
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    replicas: 1
    # PrometheusRule alerting rules (requires Prometheus Operator CRDs)
    rules:
      enabled: false
      additionalLabels: {}
      highErrorRate:
        threshold: 0.05    # 5 % error rate
        duration: 5m
      highLatency:
        threshold: 1.0     # seconds (p95)
        duration: 5m
      lowThroughput:
        threshold: 1       # requests per second
        duration: 10m
      podCrashLooping:
        threshold: 5       # restarts in 15 min
      highMemoryUsage:
        threshold: 0.85    # 85 % of limit
        duration: 10m
    # PodMonitor for Prometheus Operator
    podMonitor:
      enabled: false
      additionalLabels: {}
      metricsPath: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings: []
  grafana:
    enabled: false
    image:
      repository: grafana/grafana
      tag: "10.4.0"
      pullPolicy: IfNotPresent
    replicas: 1
    adminUser: admin
    adminPassword: admin
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    dashboards:
      # Auto-import dashboards from ConfigMaps labeled grafana_dashboard
      autoImport: true
      label: grafana_dashboard

  # ── Jaeger (Distributed Tracing) ────────────────────────────────────────────
  jaeger:
    enabled: false
    image:
      repository: jaegertracing/all-in-one
      tag: "1.55"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # ── Tempo (Distributed Tracing — alternative to Jaeger) ─────────────────────
  tempo:
    enabled: false
    image:
      repository: grafana/tempo
      tag: "2.4.0"
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # ── Loki (Log Aggregation) ──────────────────────────────────────────────────
  loki:
    enabled: false
    image:
      repository: grafana/loki
      tag: "2.9.4"
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

  # ── Alertmanager ────────────────────────────────────────────────────────────
  alertmanager:
    enabled: false
    resolveTimeout: 5m
    smtpFrom: ""
    smtpSmarthost: "localhost:25"
    route:
      groupBy:
        - alertname
        - namespace
      groupWait: 30s
      groupInterval: 5m
      repeatInterval: 4h
      receiver: default
      routes: []
    receivers:
      webhook: {}
      email: {}

# ── Operator ─────────────────────────────────────────────────────────────────
operator:
  enabled: false
  image:
    repository: velocity-operator
    pullPolicy: IfNotPresent
    tag: "latest"
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  leaderElect: true
  velocityServerUrl: "http://velocity-server.velocity-system.svc.cluster.local:5000"

# ── Automated Backups ────────────────────────────────────────────────────────
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    enabled: false
    storageClass: ""
    size: 20Gi
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

# ── TLS ──────────────────────────────────────────────────────────────────────
tls:
  enabled: false
  commonName: velocity.local
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days
  secretName: velocity-tls
  issuerRef:
    name: ""
    kind: ClusterIssuer
  # cert-manager integration (replaces simple boolean toggle)
  certManager:
    enabled: false
    email: admin@velocity.local
    issuer: prod          # "prod" or "staging"
    secretName: ""        # defaults to <fullname>-tls
    commonName: ""        # defaults to tls.commonName
    duration: ""          # defaults to tls.duration
    renewBefore: ""       # defaults to tls.renewBefore
    ingressClass: nginx
    staging:
      enabled: true
    webhook:
      enabled: false
    # DNS-01 challenge providers (optional)
    dns01:
      enabled: false
      route53:
        enabled: false
        region: ""
        hostedZoneID: ""
      cloudflare:
        enabled: false
        email: ""
        apiTokenSecretRef: cloudflare-api-token

# ── Service Mesh — Istio ────────────────────────────────────────────────────
serviceMesh:
  istio:
    enabled: false
    gateway:
      enabled: false
      port: 443
      portName: https
      protocol: HTTPS
    sidecar:
      enabled: false
      outboundTrafficPolicy: REGISTRY_ONLY
      egressHosts: []
      #  - "./velocity-backend.svc.cluster.local"
    trafficManagement:
      timeout: 30s
      loadBalancer: ROUND_ROBIN   # ROUND_ROBIN | LEAST_CONN | RANDOM | PASSTHROUGH
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "5xx,reset,connect-failure"
      connectionPool:
        tcp:
          maxConnections: 100
          connectTimeout: 5s
        http:
          maxRequestsPerConnection: 0
          maxRetries: 3
      outlierDetection:
        consecutiveErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50

  # ── Service Mesh — Linkerd ──────────────────────────────────────────────────
  linkerd:
    enabled: false
    serviceProfile:
      retryBudget:
        retryRatio: 0.2
        minRetriesPerSecond: 10
        ttl: 10s
      healthTimeout: 2s
      metricsTimeout: 5s
      grpcTimeout: 30s
      grpcRetryable: true
      restTimeout: 15s

# ── Advanced Monitoring ─────────────────────────────────────────────────────
# (extends the existing monitoring.prometheus section)
# monitoring:
#   prometheus:
#     rules / podMonitor are nested under monitoring.prometheus (see below)

# ── Probes ───────────────────────────────────────────────────────────────────
# Override default probe settings for the velocity-server container.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

# ── Lifecycle ────────────────────────────────────────────────────────────────
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 10   # allow in-flight requests to drain

# ── Extra / Override ─────────────────────────────────────────────────────────
# Inject additional environment variables into the velocity-server container.
extraEnv: []
#  - name: MY_VAR
#    value: "my-value"
#  - name: SECRET_VAR
#    valueFrom:
#      secretKeyRef:
#        name: my-secret
#        key: my-key

# Mount additional volumes into the velocity-server container.
extraVolumes: []
#  - name: custom-config
#    configMap:
#      name: my-config

extraVolumeMounts: []
#  - name: custom-config
#    mountPath: /etc/velocity/custom
#    readOnly: true

# ── Redis (optional embedded cache) ─────────────────────────────────────────
redis:
  enabled: false
  replicas: 1
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  maxMemory: "256mb"
  maxMemoryPolicy: "allkeys-lru"
  password: ""
  persistence:
    enabled: false
    storageClass: ""
    size: "1Gi"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
