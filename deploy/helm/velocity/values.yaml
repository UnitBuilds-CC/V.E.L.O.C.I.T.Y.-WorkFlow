# =============================================================================
# Default values for the Velocity Workflow Helm chart
# Production-grade configuration
# =============================================================================

# ── Replica Count ────────────────────────────────────────────────────────────
replicaCount: 2

# ── Deployment Strategy ──────────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Keep this many old ReplicaSets for rollback
revisionHistoryLimit: 10

# ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: velocity-workflow-server
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: "velocity-server"

# ── Pod Metadata ─────────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5000"
  prometheus.io/path: "/metrics"

podLabels: {}

# ── Security ─────────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  httpPort: 5000
  grpcPort: 50051
  annotations: {}
  # Optional static IPs for LoadBalancer type
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: velocity.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: velocity-tls
  #    hosts:
  #      - velocity.local

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

# ── Autoscaling ──────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

# ── Scheduling ───────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
dnsPolicy: ClusterFirst
dnsConfig:
  options:
    - name: ndots
      value: "2"

# ── Application Configuration ────────────────────────────────────────────────
config:
  environment: Production
  logging:
    level: Information
  metrics:
    enabled: true

# ── PostgreSQL ───────────────────────────────────────────────────────────────
postgresql:
  # Set to false to use an external database; set host accordingly.
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: velocity
    password: velocity_secret
    database: velocity
    existingSecret: ""
    existingSecretKey: password
  port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  # Init container runs schema migrations on first boot
  initSchema:
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
  # PostgreSQL tuning (applied via environment variables)
  tuning:
    maxConnections: 200
    sharedBuffers: 256MB
    effectiveCacheSize: 768MB
    workMem: 4MB
    maintenanceWorkMem: 64MB
    walLevel: replica
    maxWalSenders: 3

# ── gRPC ─────────────────────────────────────────────────────────────────────
grpc:
  port: 50051

# ── Auth ─────────────────────────────────────────────────────────────────────
auth:
  jwtIssuer: ""
  jwtAudience: ""
  apiKeys: []

# ── Pod Disruption Budget ────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# ── Network Policy ───────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  allowedIngressNamespaces: []
  postgresqlNamespace: ""
  prometheusNamespace: "monitoring"
  ingressRules: []
  #  - from:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: monitoring
  #    ports:
  #      - protocol: TCP
  #        port: 5000
  egressRules: []
  #  - to:
  #      - namespaceSelector:
  #          matchLabels:
  #            kubernetes.io/metadata.name: velocity-system
  #    ports:
  #      - protocol: TCP
  #        port: 5432

# ── Service Monitor (Prometheus Operator) ────────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  metricsPath: /metrics
  honorLabels: true
  additionalLabels: {}
  relabelings: []

# ── Grafana Dashboard ────────────────────────────────────────────────────────
grafanaDashboard:
  enabled: true
  additionalLabels:
    grafana_dashboard: "1"
  annotations: {}

# ── Topology Spread Constraints ──────────────────────────────────────────────
topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule

# ── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  dashboards:
    enabled: false
    namespace: monitoring
    labels:
      grafana_dashboard: "1"
  prometheus:
    enabled: false
    image:
      repository: prom/prometheus
      tag: "v2.51.0"
      pullPolicy: IfNotPresent
    scrapeInterval: 30s
    retention: 15d
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
    replicas: 1
  grafana:
    enabled: false
    image:
      repository: grafana/grafana
      tag: "10.4.0"
      pullPolicy: IfNotPresent
    replicas: 1
    adminUser: admin
    adminPassword: admin
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    dashboards:
      # Auto-import dashboards from ConfigMaps labeled grafana_dashboard
      autoImport: true
      label: grafana_dashboard

# ── Operator ─────────────────────────────────────────────────────────────────
operator:
  enabled: false
  image:
    repository: velocity-operator
    pullPolicy: IfNotPresent
    tag: "latest"
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  leaderElect: true
  velocityServerUrl: "http://velocity-server.velocity-system.svc.cluster.local:5000"

# ── Automated Backups ────────────────────────────────────────────────────────
backup:
  enabled: false
  schedule: "0 2 * * *"
  retention: 7
  image:
    repository: postgres
    tag: "16-alpine"
  storage:
    enabled: false
    storageClass: ""
    size: 20Gi
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

# ── TLS ──────────────────────────────────────────────────────────────────────
tls:
  enabled: false
  certManager: true
  issuerRef:
    name: ""
    kind: ClusterIssuer
  secretName: velocity-tls
  commonName: velocity.local
  duration: 2160h   # 90 days
  renewBefore: 360h # 15 days

# ── Probes ───────────────────────────────────────────────────────────────────
# Override default probe settings for the velocity-server container.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  enabled: false
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 30

# ── Lifecycle ────────────────────────────────────────────────────────────────
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 10   # allow in-flight requests to drain

# ── Extra / Override ─────────────────────────────────────────────────────────
# Inject additional environment variables into the velocity-server container.
extraEnv: []
#  - name: MY_VAR
#    value: "my-value"
#  - name: SECRET_VAR
#    valueFrom:
#      secretKeyRef:
#        name: my-secret
#        key: my-key

# Mount additional volumes into the velocity-server container.
extraVolumes: []
#  - name: custom-config
#    configMap:
#      name: my-config

extraVolumeMounts: []
#  - name: custom-config
#    mountPath: /etc/velocity/custom
#    readOnly: true
