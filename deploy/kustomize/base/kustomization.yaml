apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velocity-system

resources:
  # Helm-rendered output (run `helm template` first and place output here,
  # or reference the raw manifests directly).
  - ../../operator/crd.yaml
  - ../../operator/rbac.yaml
  - ../../operator/deployment.yaml
  - ../../k8s/namespace.yaml
  - ../../k8s/postgres.yaml
  - ../../k8s/rbac.yaml

commonLabels:
  app.kubernetes.io/part-of: velocity
  app.kubernetes.io/managed-by: kustomize
