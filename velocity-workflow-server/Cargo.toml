[package]
name = "velocity-workflow-server"
version = "0.1.0"
edition = "2021"
description = "Velocity Workflow Server — VCTP transport (zero-copy UDP)"

[[bin]]
name = "velocity-server"
path = "src/main.rs"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine", features = ["postgres"] }
velocity-server-bootstrap = { path = "../velocity-server-bootstrap" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
