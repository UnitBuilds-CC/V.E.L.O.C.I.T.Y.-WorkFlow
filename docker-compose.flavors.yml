# Velocity Workflow — All 3 Flavors Docker Compose
# 
# Brings up all 3 server flavors for benchmarking:
#   1. workflow-server  — VCTP (zero-copy UDP) — competes with Temporal gRPC
#   2. classic-server   — NMCP (shmem + WebSocket) — competes with Restate/Inngest
#   3. embedded-server  — NMCP (shmem + WebSocket) — competes with DBOS
#
# Usage:
#   docker compose -f docker-compose.flavors.yml up --build
#   docker compose -f docker-compose.flavors.yml up workflow-server classic-server embedded-server
#   docker compose -f docker-compose.flavors.yml run bench-workflow
#   docker compose -f docker-compose.flavors.yml run bench-classic
#   docker compose -f docker-compose.flavors.yml run bench-embedded

services:
  # ─── PostgreSQL — durable persistence for all flavors ───────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: velocity-postgres
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity
      POSTGRES_DB: velocity_workflow
    ports:
      - "25432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity_workflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Flavor 1: Workflow Server (VCTP/UDP) ──────────────────────────────────
  workflow-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.workflow-server
    container_name: velocity-workflow-server
    ports:
      - "7234:7234/udp"
      - "18080:8080"
    environment:
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--ip"
      - "0.0.0.0"
      - "--vctp-port"
      - "7234"
      - "--http-bench-port"
      - "8080"
      - "--wal-path"
      - "/data/velocity.wal"
      - "--postgres"
      - "host=postgres port=5432 dbname=velocity_workflow user=velocity password=velocity sslmode=disable"
    volumes:
      - workflow-data:/data
    healthcheck:
      test: ["CMD", "ls", "/usr/local/bin/velocity-server"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Flavor 2: Classic Server (NMCP) ───────────────────────────────────────
  classic-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.classic-server
    container_name: velocity-classic-server
    ports:
      - "28083:8083"
    environment:
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--ws-bind"
      - "0.0.0.0:8083"
      - "--shmem-path"
      - "/tmp/velocity/classic.nmcp"
      - "--wal-path"
      - "/data/classic.wal"
      - "--postgres"
      - "host=postgres port=5432 dbname=velocity_workflow user=velocity password=velocity sslmode=disable"
    volumes:
      - classic-data:/data
      - classic-shmem:/tmp/velocity
    healthcheck:
      test: ["CMD", "ls", "/usr/local/bin/velocity-classic-server"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Flavor 3: Embedded Server (NMCP) ──────────────────────────────────────
  embedded-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.embedded-server
    container_name: velocity-embedded-server
    ports:
      - "28084:8084"
    environment:
      - RUST_LOG=info
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "--ws-bind"
      - "0.0.0.0:8084"
      - "--shmem-path"
      - "/tmp/velocity/embedded.nmcp"
      - "--wal-path"
      - "/data/embedded.wal"
      - "--postgres"
      - "host=postgres port=5432 dbname=velocity_workflow user=velocity password=velocity sslmode=disable"
    volumes:
      - embedded-data:/data
      - embedded-shmem:/tmp/velocity
    healthcheck:
      test: ["CMD", "ls", "/usr/local/bin/velocity-embedded-server"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Benchmark: Workflow Server (VCTP/UDP) ─────────────────────────────
  bench-workflow:
    image: python:3.12-slim
    container_name: velocity-bench-workflow
    depends_on:
      - workflow-server
    environment:
      - ITERATIONS=${ITERATIONS:-5000}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Velocity Workflow Server (VCTP/UDP) Benchmark ==="
        echo "Target: workflow-server:7234 (UDP)"
        echo "Iterations: $$ITERATIONS"
        echo ""
        python3 -c "
        import socket, struct, json, time, os, binascii
        
        VCTP_MAGIC = 0x50544356
        VCTP_ACK_MAGIC = 0x4B435656
        VCTP_HEADER_SIZE = 28
        
        def crc32(data):
            return binascii.crc32(data) & 0xFFFFFFFF
        
        def build_packet(seq, wf_id, payload):
            header = struct.pack('<IQQII', VCTP_MAGIC, seq, wf_id, 0, len(payload))
            return header + payload + struct.pack('<I', crc32(header + payload))
        
        def recv_resp(sock):
            while True:
                data, _ = sock.recvfrom(65535)
                if len(data) >= 4:
                    m = struct.unpack('<I', data[:4])[0]
                    if m == VCTP_ACK_MAGIC: continue
                    if m == VCTP_MAGIC: return data
        
        def parse_resp(data):
            pl = struct.unpack('<I', data[24:28])[0]
            return json.loads(data[28:28+pl])
        
        sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
        sock.settimeout(5.0)
        N = int(os.environ.get('ITERATIONS', 5000))
        
        # Warmup
        for i in range(10):
            req = json.dumps({'method':100,'namespace':'default','workflow_id':f'warm-{i}','workflow_type':'bench','total_steps':10}).encode()
            sock.sendto(build_packet(i, 0, req), ('workflow-server', 7234))
            recv_resp(sock)
        
        start = time.time()
        ok = 0
        for i in range(N):
            req = json.dumps({'method':100,'namespace':'default','workflow_id':f'vctp-{i}','workflow_type':'bench','total_steps':10}).encode()
            sock.sendto(build_packet(100+i, 0, req), ('workflow-server', 7234))
            data = recv_resp(sock)
            resp = parse_resp(data)
            if resp.get('status') == 0: ok += 1
        elapsed = time.time() - start
        
        print(f'Completed {ok}/{N} workflows in {elapsed:.3f}s')
        print(f'Throughput: {ok/elapsed:.0f} workflows/sec')
        print(f'Latency: {elapsed/ok*1000:.3f} ms/workflow')
        sock.close()
        "

  # ─── Benchmark: Classic Server (NMCP WebSocket) ────────────────────────────
  bench-classic:
    image: python:3.12-slim
    container_name: velocity-bench-classic
    depends_on:
      - classic-server
    environment:
      - ITERATIONS=${ITERATIONS:-1000}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Velocity Classic Server (NMCP) Benchmark ==="
        echo "Target: classic-server:8083 (WebSocket)"
        echo "Iterations: $$ITERATIONS"
        echo ""
        pip install websocket-client -q
        python3 -c "
        import websocket
        import json
        import time
        import os
        import struct
        
        def make_nmcp_frame(frame_type, payload_dict):
            payload = json.dumps(payload_dict).encode()
            header = struct.pack('<IIII', 0x50434D4E, frame_type, len(payload), 1)
            return header + payload
        
        def parse_nmcp_response(data):
            magic, ftype, plen, seq = struct.unpack('<IIII', data[:16])
            body = json.loads(data[16:16+plen])
            return body
        
        ws = websocket.create_connection('ws://classic-server:8083')
        
        N = int(os.environ.get('ITERATIONS', 1000))
        start = time.time()
        
        for i in range(N):
            frame = make_nmcp_frame(50, {'workflow_type': 'bench', 'workflow_id': f'wf-{i}'})
            ws.send_binary(frame)
            resp = ws.recv()
            body = parse_nmcp_response(resp)
            assert body.get('success'), f'Failed: {body}'
        
        elapsed = time.time() - start
        print(f'Completed {N} workflows in {elapsed:.3f}s')
        print(f'Throughput: {N/elapsed:.0f} workflows/sec')
        print(f'Latency: {elapsed/N*1000:.3f} ms/workflow')
        ws.close()
        "

  # ─── Benchmark: Embedded Server (NMCP WebSocket) ───────────────────────────
  bench-embedded:
    image: python:3.12-slim
    container_name: velocity-bench-embedded
    depends_on:
      - embedded-server
    environment:
      - ITERATIONS=${ITERATIONS:-1000}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Velocity Embedded Server (NMCP) Benchmark ==="
        echo "Target: embedded-server:8084 (WebSocket)"
        echo "Iterations: $$ITERATIONS"
        echo ""
        pip install websocket-client -q
        python3 -c "
        import websocket
        import json
        import time
        import os
        import struct
        
        def make_nmcp_frame(frame_type, payload_dict):
            payload = json.dumps(payload_dict).encode()
            header = struct.pack('<IIII', 0x50434D4E, frame_type, len(payload), 1)
            return header + payload
        
        def parse_nmcp_response(data):
            magic, ftype, plen, seq = struct.unpack('<IIII', data[:16])
            body = json.loads(data[16:16+plen])
            return body
        
        ws = websocket.create_connection('ws://embedded-server:8084')
        
        N = int(os.environ.get('ITERATIONS', 1000))
        start = time.time()
        
        for i in range(N):
            frame = make_nmcp_frame(70, {'workflow_type': 'bench', 'workflow_id': f'emb-{i}'})
            ws.send_binary(frame)
            resp = ws.recv()
            body = parse_nmcp_response(resp)
            assert body.get('success'), f'Failed: {body}'
        
        elapsed = time.time() - start
        print(f'Completed {N} workflows in {elapsed:.3f}s')
        print(f'Throughput: {N/elapsed:.0f} workflows/sec')
        print(f'Latency: {elapsed/N*1000:.3f} ms/workflow')
        ws.close()
        "

volumes:
  pg-data:
  workflow-data:
  classic-data:
  classic-shmem:
  embedded-data:
  embedded-shmem:
