[workspace]
members = [
    "velocity-workflow-core",
    "velocity-workflow-engine",
    "velocity-workflow-daemon",
    "velocity-workflow-server",
    "velocity-nmcp-protocol",
    "velocity-server-bootstrap",
    "velocity-bench",
    "velocity-dev-server",
    "velocity-test-framework",
    "velocity-embedded",
    "velocity-embedded-server",
    "velocity-classic",
    "velocity-classic-server",
    "bench-suite/prod-bench",
    "bench-suite/velocity-bench-server",
    "sdk/rust",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Fast compilation profile for CI/Docker builds (no LTO, parallel codegen)
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
