[workspace]
members = [
    "velocity-workflow-core",
    "velocity-workflow-engine",
    "velocity-workflow-daemon",
    "velocity-bench",
    "velocity-dev-server",
    "velocity-test-framework",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Fast compilation profile for CI/Docker builds (no LTO, parallel codegen)
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
