[package]
name = "velocity-sdk"
version = "0.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Native Rust SDK for the VELOCITY-WorkFlow engine — wraps WorkflowEngine directly as a library"
license = "Apache-2.0"

[lib]
name = "velocity_sdk"
path = "src/lib.rs"

[dependencies]
velocity-workflow-engine = { path = "../../velocity-workflow-engine" }

[dev-dependencies]
# Tests use the built-in test framework; no extra crates required.
