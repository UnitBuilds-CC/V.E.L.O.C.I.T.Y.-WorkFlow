[package]
name = "velocity-test-framework"
version = "1.0.0"
publish = false
edition = "2021"
description = "Testing framework for VELOCITY-WorkFlow integration and workflow tests"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
