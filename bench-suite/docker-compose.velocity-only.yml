# Velocity-only benchmark — 3 Rust flavors side by side.
#
# Usage:
#   docker compose -f docker-compose.velocity-only.yml up -d
#   # Classic  → localhost:8083  (HTTP + WAL, Temporal-compatible)
#   # Runtime  → localhost:7234  (gRPC), localhost:8080 (HTTP + WAL)
#   # Embedded → localhost:18082 (HTTP + PostgreSQL)

services:

  velocity-classic:
    build:
      context: ..
      dockerfile: bench-suite/docker/velocity-classic/Dockerfile
    image: velocity-bench/classic:latest
    container_name: bench-velocity-classic
    ports:
      - "8083:8083"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    restart: unless-stopped

  velocity-runtime:
    build:
      context: ..
      dockerfile: bench-suite/docker/velocity-runtime/Dockerfile
    image: velocity-bench/runtime:latest
    container_name: bench-velocity-runtime
    ports:
      - "7234:7234"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    restart: unless-stopped

  velocity-postgres:
    image: postgres:16-alpine
    container_name: bench-velocity-postgres
    environment:
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity_bench
      POSTGRES_DB: velocity
    volumes:
      - velocity-pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity"]
      interval: 5s
      timeout: 3s
      retries: 10

  velocity-embedded:
    build:
      context: ..
      dockerfile: bench-suite/docker/velocity-embedded/Dockerfile
    image: velocity-bench/embedded:latest
    container_name: bench-velocity-embedded
    ports:
      - "18082:18082"
    environment:
      DATABASE_URL: postgresql://velocity:velocity_bench@velocity-postgres:5432/velocity
    depends_on:
      velocity-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    restart: unless-stopped

volumes:
  velocity-pg-data:
