---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-server
  namespace: benchmark
  labels:
    app: temporal-server
    engine: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:latest
          env:
            - name: DB
              value: sqlite
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: /etc/temporal/dynamicconfig/development.yaml
          ports:
            - containerPort: 7233
              name: grpc
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7233
            initialDelaySeconds: 45
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-server
  namespace: benchmark
  labels:
    app: temporal-server
spec:
  selector:
    app: temporal-server
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
  type: ClusterIP
