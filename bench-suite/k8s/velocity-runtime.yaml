---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-runtime
  namespace: benchmark
  labels:
    app: velocity-runtime
    engine: velocity
    flavor: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocity-runtime
  template:
    metadata:
      labels:
        app: velocity-runtime
    spec:
      containers:
        - name: velocity-runtime
          image: us-east1-docker.pkg.dev/velocity-live-test-001/velocity/velocity-runtime:latest
          imagePullPolicy: Always
          workingDir: /app/velocity-workflow-server
          command: ["./target/release/velocity-server"]
          ports:
            - containerPort: 7234
              name: grpc
          args:
            - --ip
            - 0.0.0.0
            - --grpc-port
            - "7234"
            - --real-engine
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 7234
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7234
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: velocity-runtime
  namespace: benchmark
  labels:
    app: velocity-runtime
spec:
  selector:
    app: velocity-runtime
  ports:
    - name: grpc
      port: 7234
      targetPort: 7234
  type: ClusterIP
