---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-bench
  namespace: benchmark
  labels:
    app: temporal-bench
    engine: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-bench
  template:
    metadata:
      labels:
        app: temporal-bench
    spec:
      containers:
        - name: temporal-bench
          image: us-east1-docker.pkg.dev/velocity-live-test-001/velocity/temporal-bench:latest
          imagePullPolicy: Always
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-server:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_HTTP_PORT
              value: "8080"
            - name: TEMPORAL_TASK_QUEUE
              value: bench-queue
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-bench
  namespace: benchmark
  labels:
    app: temporal-bench
spec:
  selector:
    app: temporal-bench
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
