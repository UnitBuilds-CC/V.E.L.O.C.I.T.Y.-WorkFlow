---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restate-server
  namespace: benchmark
  labels:
    app: restate-server
    engine: restate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restate-server
  template:
    metadata:
      labels:
        app: restate-server
    spec:
      containers:
        - name: restate
          image: restatedev/restate:latest
          ports:
            - containerPort: 8080
              name: ingress
            - containerPort: 9070
              name: admin
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 9070
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9070
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: restate-server
  namespace: benchmark
  labels:
    app: restate-server
spec:
  selector:
    app: restate-server
  ports:
    - name: ingress
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9070
      targetPort: 9070
  type: ClusterIP
