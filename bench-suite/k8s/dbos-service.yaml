---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbos-service
  namespace: benchmark
  labels:
    app: dbos-service
    engine: dbos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbos-service
  template:
    metadata:
      labels:
        app: dbos-service
    spec:
      containers:
        - name: dbos-service
          image: velocity-bench/dbos:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DBOS_DATABASE_URL
              value: postgresql://dbos:dbos_bench@dbos-postgres:5432/dbos_bench
            - name: DBOS_HTTP_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dbos-service
  namespace: benchmark
  labels:
    app: dbos-service
spec:
  selector:
    app: dbos-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
