[package]
name = "velocity-bench-server"
version = "1.0.0"
publish = false
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Velocity production benchmark HTTP server — real WorkflowEngine + WAL persistence"

[[bin]]
name = "velocity-bench-server"
path = "src/main.rs"

[dependencies]
velocity-workflow-engine = { path = "../../velocity-workflow-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
