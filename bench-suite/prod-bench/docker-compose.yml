# =============================================================================
# Production Benchmark Suite — Real Engines, Real APIs, Real Persistence
# =============================================================================
# Engines:
#   - Velocity Server (gRPC + WAL)
#   - Velocity Embedded (HTTP + PostgreSQL)
#   - Velocity Classic (HTTP, Temporal-compatible)
#   - DBOS (Python + PostgreSQL)
#   - Restate (Durable Execution)
#   - Temporal (gRPC + SQLite)
#
# Usage:
#   docker compose up -d           # Start all engines
#   docker compose run prod-bench  # Run benchmarks
#   docker compose down -v         # Tear down
# =============================================================================

services:
  # ── Velocity Server (Real gRPC + WAL persistence) ────────────────────────
  velocity:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.production-server
    container_name: pb-velocity
    command: ["./target/release/velocity-server", "--ip", "0.0.0.0", "--grpc-port", "7234", "--wal-path", "/data/velocity.wal"]
    ports:
      - "17234:7234"   # gRPC (BenchmarkService)
    volumes:
      - velocity-wal:/data
    networks:
      - bench-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'echo > /dev/tcp/localhost/7234'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    restart: unless-stopped

  # ── Velocity Embedded (HTTP + PostgreSQL-backed) ─────────────────────────
  velocity-embedded-postgres:
    image: postgres:16-alpine
    container_name: pb-velocity-embedded-pg
    environment:
      POSTGRES_DB: velocity_embedded
      POSTGRES_USER: velocity
      POSTGRES_PASSWORD: velocity
    networks:
      - bench-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocity -d velocity_embedded"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  velocity-embedded:
    build:
      context: ../..
      dockerfile: velocity-embedded-server/Dockerfile
    container_name: pb-velocity-embedded
    ports:
      - "18082:8082"   # HTTP API
    environment:
      DATABASE_URL: postgresql://velocity:velocity@velocity-embedded-postgres:5432/velocity_embedded
    depends_on:
      velocity-embedded-postgres:
        condition: service_healthy
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Velocity Classic (HTTP, Temporal-compatible) ─────────────────────────
  velocity-classic:
    build:
      context: ../..
      dockerfile: velocity-classic-ts/Dockerfile
    container_name: pb-velocity-classic
    ports:
      - "18083:8083"   # HTTP API
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── DBOS (Python HTTP + PostgreSQL) ──────────────────────────────────────
  dbos-postgres:
    image: postgres:16-alpine
    container_name: pb-dbos-pg
    environment:
      POSTGRES_DB: dbos_bench
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos_bench
    networks:
      - bench-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d dbos_bench"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  dbos:
    build:
      context: .
      dockerfile: Dockerfile.dbos
    container_name: pb-dbos
    ports:
      - "18081:8080"
    environment:
      DATABASE_URL: postgresql://dbos:dbos_bench@dbos-postgres:5432/dbos_bench
    depends_on:
      dbos-postgres:
        condition: service_healthy
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ── Restate (Durable Execution Engine) ───────────────────────────────────
  restate:
    image: docker.io/restatedev/restate:latest
    container_name: pb-restate
    ports:
      - "19070:8080"   # Ingress (HTTP)
      - "19071:9070"   # Admin
    networks:
      - bench-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Restate bench service (registers with Restate server)
  restate-bench-svc:
    build:
      context: ./restate-service
    container_name: pb-restate-svc
    networks:
      - bench-net
    depends_on:
      restate:
        condition: service_started

  # Register the bench service with Restate after both are up
  restate-register:
    image: docker.io/restatedev/restate:latest
    container_name: pb-restate-reg
    depends_on:
      restate:
        condition: service_started
      restate-bench-svc:
        condition: service_started
    entrypoint: ["sh", "-c", "sleep 5 && restate deployments register http://restate-bench-svc:9080 --force --yes"]
    environment:
      RESTATE_ADMIN_URL: http://restate:9070
    networks:
      - bench-net
    restart: "no"

  # ── Temporal (gRPC + PostgreSQL) ─────────────────────────────────────────
  temporal-postgres:
    image: postgres:16-alpine
    container_name: pb-temporal-pg
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_bench
      POSTGRES_DB: temporal
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: pb-temporal
    ports:
      - "17233:7233"   # gRPC frontend
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_bench
      - POSTGRES_SEEDS=temporal-postgres
      - FRONTEND_BIND_ADDRESS=0.0.0.0:7233
    depends_on:
      temporal-postgres:
        condition: service_healthy
    networks:
      - bench-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # Temporal bench client (Go SDK)
  temporal-bench:
    build:
      context: ./temporal-bench
    container_name: pb-temporal-bench
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    networks:
      - bench-net
    profiles:
      - bench
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ── Production Bench Client ──────────────────────────────────────────────
  prod-bench:
    build:
      context: ../..
      dockerfile: bench-suite/prod-bench/Dockerfile
    container_name: pb-runner
    depends_on:
      velocity:
        condition: service_healthy
      velocity-embedded:
        condition: service_healthy
      velocity-classic:
        condition: service_healthy
      dbos:
        condition: service_healthy
      restate:
        condition: service_healthy
    environment:
      VELOCITY_URL: http://velocity:7234
      VELOCITY_EMBEDDED_URL: http://velocity-embedded:8082
      VELOCITY_CLASSIC_URL: http://velocity-classic:8083
      DBOS_URL: http://dbos:8080
      RESTATE_URL: http://restate:8080
    networks:
      - bench-net
    profiles:
      - bench
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

networks:
  bench-net:
    driver: bridge

volumes:
  velocity-wal:
