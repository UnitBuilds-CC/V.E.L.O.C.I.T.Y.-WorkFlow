[package]
name = "prod-bench"
version = "0.1.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Production benchmark suite: Velocity vs Temporal vs DBOS vs Restate"
build = "build.rs"

[[bin]]
name = "prod-bench"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
futures = "0.3"
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"
