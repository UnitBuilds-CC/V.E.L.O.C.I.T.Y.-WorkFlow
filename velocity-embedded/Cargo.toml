[package]
name = "velocity-embedded"
version = "0.1.0"
edition = "2021"
authors = ["Velocity Team"]
description = "DBOS-compatible embedded durable execution engine — library crate with Postgres adapter"

[dependencies]
velocity-workflow-engine = { path = "../velocity-workflow-engine" }
velocity-workflow-core = { path = "../velocity-workflow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1", features = ["time", "sync", "rt", "rt-multi-thread"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
